<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 980" role="img" aria-labelledby="title description"><title id="title">Техническая схема Services</title><desc id="description">Общий контур: документация и контракты, Next.js с CDN, мобильный Capacitor, админка, NestJS API, PostgreSQL, фоновые задания и объектное хранилище.</desc><defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5L0 9Z" fill="#9FB0C1"/></marker></defs><rect width="1340" height="980" fill="#F8FAFC"/><text x="56" y="63" font-family="system-ui,Segoe UI,Arial,sans-serif" fill="#16324C" font-size="30" font-weight="800" text-anchor="start">SERVICES / ТЕХНИЧЕСКАЯ АРХИТЕКТУРА</text><text x="56" y="96" font-family="system-ui,Segoe UI,Arial,sans-serif" fill="#576E80" font-size="17" font-weight="500" text-anchor="start">Один API и одна модель данных. Публичная витрина масштабируется отдельно от операций заказа.</text><rect x="56" y="140" width="378" height="142" rx="17" fill="#E7F6F0" stroke="#DBE5EF" stroke-width="1.5"/><text x="79" y="176" font-family="system-ui,Segoe UI,Arial,sans-serif" fill="#1B3A53" font-size="20" font-weight="780" text-anchor="start">WEB / PWA</text><text x="79" y="214" font-family="system-ui,Segoe UI,Arial,sans-serif" fill="#41637A" font-size="16" font-weight="500" text-anchor="start">Next.js · SEO · SSR · CDN</text><text x="79" y="245" font-family="system-ui,Segoe UI,Arial,sans-serif" fill="#62788C" font-size="15" font-weight="500" text-anchor="start">Публичный каталог и кабинеты</text><rect x="480" y="140" width="378" height="142" rx="17" fill="#ECF3FF" stroke="#DBE5EF" stroke-width="1.5"/><text x="503" y="176" font-family="system-ui,Segoe UI,Arial,sans-serif" fill="#1B3A53" font-size="20" font-weight="780" text-anchor="start">ANDROID / iOS</text><text x="503" y="214" font-family="system-ui,Segoe UI,Arial,sans-serif" fill="#41637A" font-size="16" font-weight="500" text-anchor="start">React · Capacitor · shared UI</text><text x="503" y="245" font-family="system-ui,Segoe UI,Arial,sans-serif" fill="#62788C" font-size="15" font-weight="500" text-anchor="start">Гостевой поиск, заявки, уведомления</text><rect x="904" y="140" width="378" height="142" rx="17" fill="#F1ECFC" stroke="#DBE5EF" stroke-width="1.5"/><text x="927" y="176" font-family="system-ui,Segoe UI,Arial,sans-serif" fill="#1B3A53" font-size="20" font-weight="780" text-anchor="start">ADMIN</text><text x="927" y="214" font-family="system-ui,Segoe UI,Arial,sans-serif" fill="#41637A" font-size="16" font-weight="500" text-anchor="start">Next.js · отдельные роли</text><text x="927" y="245" font-family="system-ui,Segoe UI,Arial,sans-serif" fill="#62788C" font-size="15" font-weight="500" text-anchor="start">Проверки, жалобы, справочники</text><path d="M245 283 L245 346" stroke="#9FB0C1" stroke-width="2.5" fill="none" marker-end="url(#ah)"/><path d="M669 283 L669 346" stroke="#9FB0C1" stroke-width="2.5" fill="none" marker-end="url(#ah)"/><path d="M1093 283 L1093 346" stroke="#9FB0C1" stroke-width="2.5" fill="none" marker-end="url(#ah)"/><rect x="56" y="359" width="1226" height="110" rx="17" fill="#FFFFFF" stroke="#CDDBE8" stroke-width="1.5"/><text x="84" y="396" font-family="system-ui,Segoe UI,Arial,sans-serif" fill="#163650" font-size="20" font-weight="800" text-anchor="start">EDGE / CDN / КЕШ ПУБЛИЧНОГО КОНТЕНТА</text><text x="84" y="427" font-family="system-ui,Segoe UI,Arial,sans-serif" fill="#49677D" font-size="16" font-weight="500" text-anchor="start">Кешируются опубликованные страницы и поисковые ответы с ограниченным TTL; приватные заявки и контакты — no-store</text><path d="M669 470 L669 519" stroke="#9FB0C1" stroke-width="2.5" fill="none" marker-end="url(#ah)"/><rect x="56" y="535" width="1226" height="151" rx="17" fill="#EAF2FA" stroke="#C4D8E9" stroke-width="1.5"/><text x="86" y="571" font-family="system-ui,Segoe UI,Arial,sans-serif" fill="#1A3D57" font-size="21" font-weight="790" text-anchor="start">BACKEND / NESTJS · МОДУЛЬНЫЙ МОНОЛИТ</text><text x="86" y="609" font-family="system-ui,Segoe UI,Arial,sans-serif" fill="#395A71" font-size="17" font-weight="500" text-anchor="start">Auth + права по объекту    •    Профили/компании    •    Геокаталог/поиск    •    Offers/заявки/отзывы</text><text x="86" y="641" font-family="system-ui,Segoe UI,Arial,sans-serif" fill="#47677D" font-size="16" font-weight="500" text-anchor="start">Транзакции + Idempotency-Key + outbox + аудит    •    единые OpenAPI-контракты для всех клиентов</text><path d="M257 687 L257 731" stroke="#9FB0C1" stroke-width="2.5" fill="none" marker-end="url(#ah)"/><path d="M669 687 L669 731" stroke="#9FB0C1" stroke-width="2.5" fill="none" marker-end="url(#ah)"/><path d="M1080 687 L1080 731" stroke="#9FB0C1" stroke-width="2.5" fill="none" marker-end="url(#ah)"/><rect x="56" y="741" width="378" height="122" rx="17" fill="#F1F5FF" stroke="#DBE5EF" stroke-width="1.5"/><text x="80" y="778" font-family="system-ui,Segoe UI,Arial,sans-serif" fill="#1E4156" font-size="18" font-weight="800" text-anchor="start">POSTGRESQL</text><text x="80" y="812" font-family="system-ui,Segoe UI,Arial,sans-serif" fill="#4B6778" font-size="16" font-weight="500" text-anchor="start">Сущности, роли, заказы</text><text x="80" y="840" font-family="system-ui,Segoe UI,Arial,sans-serif" fill="#5D7488" font-size="15" font-weight="500" text-anchor="start">Индексы, миграции, уникальность</text><rect x="480" y="741" width="378" height="122" rx="17" fill="#F2F9F3" stroke="#DBE5EF" stroke-width="1.5"/><text x="504" y="778" font-family="system-ui,Segoe UI,Arial,sans-serif" fill="#1E4156" font-size="18" font-weight="800" text-anchor="start">WORKER / OUTBOX</text><text x="504" y="812" font-family="system-ui,Segoe UI,Arial,sans-serif" fill="#4B6778" font-size="16" font-weight="500" text-anchor="start">Уведомления, индексация</text><text x="504" y="840" font-family="system-ui,Segoe UI,Arial,sans-serif" fill="#5D7488" font-size="15" font-weight="500" text-anchor="start">Повторы, дедупликация, очереди</text><rect x="904" y="741" width="378" height="122" rx="17" fill="#FCF6EE" stroke="#DBE5EF" stroke-width="1.5"/><text x="928" y="778" font-family="system-ui,Segoe UI,Arial,sans-serif" fill="#1E4156" font-size="18" font-weight="800" text-anchor="start">MEDIA STORAGE</text><text x="928" y="812" font-family="system-ui,Segoe UI,Arial,sans-serif" fill="#4B6778" font-size="16" font-weight="500" text-anchor="start">Фото и портфолио</text><text x="928" y="840" font-family="system-ui,Segoe UI,Arial,sans-serif" fill="#5D7488" font-size="15" font-weight="500" text-anchor="start">Валидация, безопасная раздача</text><text x="669" y="911" font-family="system-ui,Segoe UI,Arial,sans-serif" fill="#344D62" font-size="17" font-weight="640" text-anchor="middle">Безопасность: TLS, проверка прав, защита от спама, rate limits, приватность, бэкапы и мониторинг</text><text x="669" y="943" font-family="system-ui,Segoe UI,Arial,sans-serif" fill="#687C8C" font-size="15" font-weight="450" text-anchor="middle">Глобальная модель; запуск по странам поэтапно. Отдельные кластеры и search engine — по фактической нагрузке.</text></svg>