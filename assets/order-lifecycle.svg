<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 980" role="img" aria-labelledby="t d"><title id="t">Процесс приёма заказа и права продавца</title><desc id="d">Посетитель выбирает услугу и канал связи, продавец — специалист или компания — управляет заявкой, календарь не обязателен.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#97ACBD"/></marker></defs><rect width="1340" height="980" fill="#F8FAFC"/><text x="54" y="60" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="29" font-weight="750" fill="#10304A" text-anchor="start">ПУТЬ ЗАКАЗА / ОТ ПЕРВОГО ПОИСКА ДО ОТЗЫВА</text><text x="54" y="91" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" font-weight="500" fill="#546A80" text-anchor="start">Единый процесс, но каждый продавец самостоятельно выбирает доступные способы обращения.</text><rect x="360" y="130" width="620" height="102" rx="17" fill="#E8F7F2" stroke="#B5DFCE" stroke-width="1.5"/><text x="670" y="164" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" font-weight="770" fill="#155E54" text-anchor="middle">1. ГОСТЬ НАХОДИТ УСЛУГУ</text><text x="670" y="197" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="16" font-weight="450" fill="#395B58" text-anchor="middle">Поиск / город / цена / отзывы / кто продавец</text><path d="M670 233 L670 280" fill="none" stroke="#97ACBD" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/><text x="670" y="272" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" font-weight="770" fill="#294862" text-anchor="middle">2. ВЫБРАННЫЙ ПРОДАВЦОМ СПОСОБ СВЯЗИ</text><rect x="55" y="295" width="380" height="105" rx="17" fill="#EEF5FF" stroke="#D3DFEC" stroke-width="1.5"/><text x="245" y="333" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" font-weight="750" fill="#26465B" text-anchor="middle">ЗВОНОК / МЕССЕНДЖЕР</text><text x="245" y="363" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="15" font-weight="450" fill="#526C80" text-anchor="middle">Внешний контакт, не заказ</text><rect x="480" y="295" width="380" height="105" rx="17" fill="#E9F7F1" stroke="#D3DFEC" stroke-width="1.5"/><text x="670" y="333" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" font-weight="750" fill="#26465B" text-anchor="middle">ЗАЯВКА / ПРЕДЛОЖЕНИЕ</text><text x="670" y="363" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="15" font-weight="450" fill="#526C80" text-anchor="middle">Гость подтверждает контакт</text><rect x="905" y="295" width="380" height="105" rx="17" fill="#F3EFFF" stroke="#D3DFEC" stroke-width="1.5"/><text x="1095" y="333" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" font-weight="750" fill="#26465B" text-anchor="middle">КАЛЕНДАРЬ / СЛОТ</text><text x="1095" y="363" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="15" font-weight="450" fill="#526C80" text-anchor="middle">Только если продавец включил</text><path d="M670 401 L670 456" fill="none" stroke="#97ACBD" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="225" y="470" width="890" height="121" rx="17" fill="#FFFFFF" stroke="#C8D8E6" stroke-width="1.5"/><text x="670" y="509" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="760" fill="#173A55" text-anchor="middle">3. ОБРАЩЕНИЕ ПОЛУЧАЕТ ПРОДАВЕЦ</text><text x="670" y="542" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#52677C" text-anchor="middle">Самостоятельный специалист — принимает сам</text><text x="670" y="566" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#52677C" text-anchor="middle">Компания — принимает владелец или назначенный оператор</text><path d="M670 591 L670 627" fill="none" stroke="#97ACBD" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/><text x="670" y="620" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="16" font-weight="750" fill="#2A4A60" text-anchor="middle">4. РЕШЕНИЕ ПРОДАВЦА</text><rect x="55" y="646" width="380" height="91" rx="17" fill="#E3F6EC" stroke="#D7E2E8" stroke-width="1.5"/><text x="245" y="678" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" font-weight="750" fill="#29445A" text-anchor="middle">ПРИНЯТЬ</text><text x="245" y="710" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="15" font-weight="480" fill="#617383" text-anchor="middle">Зафиксировать условия</text><rect x="480" y="646" width="380" height="91" rx="17" fill="#FFF8E9" stroke="#D7E2E8" stroke-width="1.5"/><text x="670" y="678" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" font-weight="750" fill="#29445A" text-anchor="middle">ПРЕДЛОЖИТЬ ДРУГОЕ</text><text x="670" y="710" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="15" font-weight="480" fill="#617383" text-anchor="middle">Цена, время или объём</text><rect x="905" y="646" width="380" height="91" rx="17" fill="#FCEEF0" stroke="#D7E2E8" stroke-width="1.5"/><text x="1095" y="678" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" font-weight="750" fill="#29445A" text-anchor="middle">ОТКЛОНИТЬ</text><text x="1095" y="710" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="15" font-weight="480" fill="#617383" text-anchor="middle">Сообщить причину</text><path d="M245 738 L535 796" fill="none" stroke="#97ACBD" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M670 738 L670 796" fill="none" stroke="#97ACBD" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="235" y="801" width="870" height="105" rx="17" fill="#EDF3F9" stroke="#CCDCE9" stroke-width="1.5"/><text x="670" y="837" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" font-weight="750" fill="#1C415A" text-anchor="middle">5. СОГЛАСИЕ → ИСПОЛНЕНИЕ → ПОДТВЕРЖДЁННЫЙ ОПЫТ</text><text x="670" y="870" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#516D7E" text-anchor="middle">Отдельные отзывы исполнителю и компании — по подтверждённой услуге</text><text x="670" y="948" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#627D90" text-anchor="middle">Расписание и видимость занятости не обязательны. Клик по телефону не считается завершённым заказом.</text></svg>