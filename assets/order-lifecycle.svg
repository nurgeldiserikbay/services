<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1340 1000"><title id="title">Простые заявки Services: самостоятельный специалист или компания</title><desc id="desc">Посетитель с личной страницы обращается к мастеру, со страницы компании — к компании. Каждый продавец сам выбирает канал связи, принимает либо отклоняет заявку, ведёт необязательный календарь. Нет смет и переговоров по цене.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5L0 9Z" fill="#97AFBE"/></marker></defs><rect width="1340" height="1000" fill="#F8FAFC"/><text x="60" y="65" font-size="30" font-weight="800" fill="#17344B" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,sans-serif">SERVICES / ПРОСТОЙ ПРОЦЕСС ОБРАЩЕНИЯ</text><text x="60" y="100" font-size="17" font-weight="450" fill="#597184" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Никаких смет, торгов или обязательного календаря. Продавец принимает либо отклоняет заявку.</text><rect x="340" y="142" width="660" height="100" rx="16" fill="#EAF6F1" stroke="#D3DFEB" stroke-width="1.4"/><text x="670" y="182" font-size="21" font-weight="780" fill="#165C54" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif">КЛИЕНТ НАХОДИТ УСЛУГУ</text><text x="670" y="213" font-size="16" font-weight="480" fill="#40695E" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Поиск открыт без регистрации</text><path d="M670 242L670 290" fill="none" stroke="#97AFBE" stroke-width="2.4" marker-end="url(#a)"/><rect x="58" y="303" width="585" height="134" rx="16" fill="#EBF3FF" stroke="#D3DFEB" stroke-width="1.4"/><text x="82" y="343" font-size="19" font-weight="800" fill="#17344B" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,sans-serif">ЛИЧНАЯ СТРАНИЦА МАСТЕРА</text><text x="82" y="382" font-size="17" font-weight="550" fill="#466175" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Получатель: независимый мастер</text><text x="82" y="409" font-size="15" font-weight="450" fill="#617587" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Личные услуги, контакты, занятость</text><rect x="696" y="303" width="585" height="134" rx="16" fill="#F4F0FF" stroke="#D3DFEB" stroke-width="1.4"/><text x="720" y="343" font-size="19" font-weight="800" fill="#17344B" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,sans-serif">СТРАНИЦА КОМПАНИИ</text><text x="720" y="382" font-size="17" font-weight="550" fill="#466175" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Получатель: компания</text><text x="720" y="409" font-size="15" font-weight="450" fill="#617587" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Даже если выбран мастер в команде</text><path d="M350 438L350 497" fill="none" stroke="#97AFBE" stroke-width="2.4" marker-end="url(#a)"/><path d="M988 438L988 497" fill="none" stroke="#97AFBE" stroke-width="2.4" marker-end="url(#a)"/><rect x="60" y="510" width="1220" height="118" rx="16" fill="#fff" stroke="#D3DFEB" stroke-width="1.4"/><text x="670" y="548" font-size="20" font-weight="780" fill="#16415C" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif">ПРОДАВЕЦ САМ ВКЛЮЧАЕТ ДОСТУПНЫЕ СПОСОБЫ</text><text x="670" y="583" font-size="18" font-weight="550" fill="#3F6376" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Телефон / WhatsApp     •     Простая заявка     •     Необязательный календарь</text><text x="670" y="608" font-size="15" font-weight="440" fill="#637C8D" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Дату и время можно не показывать. Звонок не создаёт заказ в системе.</text><path d="M670 629L670 676" fill="none" stroke="#97AFBE" stroke-width="2.4" marker-end="url(#a)"/><rect x="59" y="692" width="587" height="126" rx="16" fill="#E9F7F0" stroke="#D3DFEB" stroke-width="1.4"/><text x="84" y="728" font-size="19" font-weight="790" fill="#176558" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,sans-serif">ЗАЯВКА В SERVICES</text><text x="84" y="765" font-size="18" font-weight="650" fill="#234E54" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,sans-serif">pending → принять / отклонить</text><text x="84" y="791" font-size="16" font-weight="450" fill="#577176" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Продавец отвечает в своём кабинете</text><rect x="692" y="692" width="587" height="126" rx="16" fill="#F1F4FA" stroke="#D3DFEB" stroke-width="1.4"/><text x="716" y="728" font-size="19" font-weight="790" fill="#405876" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,sans-serif">ВНЕШНЯЯ СВЯЗЬ</text><text x="716" y="765" font-size="18" font-weight="650" fill="#25465F" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Звонок / мессенджер</text><text x="716" y="791" font-size="16" font-weight="450" fill="#5F788E" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,sans-serif">После разговора можно вручную занять время</text><path d="M350 819L350 869" fill="none" stroke="#97AFBE" stroke-width="2.4" marker-end="url(#a)"/><path d="M988 819L988 869" fill="none" stroke="#97AFBE" stroke-width="2.4" marker-end="url(#a)"/><rect x="59" y="886" width="1220" height="76" rx="16" fill="#EEF4FA" stroke="#D3DFEB" stroke-width="1.4"/><text x="670" y="916" font-size="18" font-weight="720" fill="#1D425F" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Принятая запись → занятость по желанию → отмена / выполнено</text><text x="670" y="945" font-size="15" font-weight="480" fill="#607A8D" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Отзывы и статистика учитывают только реальные подтверждённые события</text></svg>