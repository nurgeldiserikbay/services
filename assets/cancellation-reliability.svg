<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1320 900"><title id="title">Отмена заявки: клиент, специалист и компания</title><desc id="desc">Продавец выбирает срок отмены. При отмене принятой записи поздняя отмена авторизованного клиента или отмена продавцом влияет на отдельные показатели надёжности. Два уведомления создаются при каждой отмене, отзывы о качестве не изменяются.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L7 4L0 8Z" fill="#A1B2C2"/></marker></defs><rect width="1320" height="900" fill="#F8FAFC"/><text x="48" y="60" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-weight="790" font-size="30" text-anchor="start" fill="#0F3049">ОТМЕНА ЗАЯВКИ И НАДЁЖНОСТЬ</text><text x="48" y="94" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-weight="480" font-size="17" text-anchor="start" fill="#5B7283">Условия задаёт продавец. Клиент всегда может отменить запись. Доставка уведомлений фиксируется отдельно.</text><rect x="310" y="129" width="700" height="101" rx="18" fill="#E9F2FA" stroke="#D1DEE9" stroke-width="1.6"/><text x="660" y="166" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-weight="790" font-size="20" text-anchor="middle" fill="#174762">ПРОДАВЕЦ ВЫБИРАЕТ СРОК ОТМЕНЫ</text><text x="660" y="198" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-weight="520" font-size="17" text-anchor="middle" fill="#567284">Например, 2 часа до начала · показывается до принятия записи</text><path d="M660 230 L660 275" stroke="#9DADC0" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><rect x="280" y="291" width="760" height="88" rx="18" fill="#FFFFFF" stroke="#D1DEE9" stroke-width="1.6"/><text x="660" y="327" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-weight="780" font-size="19" text-anchor="middle" fill="#22435A">ЗАЯВКА ПРИНЯТА, ВРЕМЯ И ДЕДЛАЙН СОХРАНЕНЫ</text><text x="660" y="352" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-weight="460" font-size="15" text-anchor="middle" fill="#6A7F91">Pending, гость или время ещё не согласовано → штрафа клиенту нет</text><path d="M350 379 L350 435" stroke="#9DADC0" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><path d="M970 379 L970 435" stroke="#9DADC0" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><rect x="45" y="453" width="610" height="161" rx="18" fill="#E9F7F0" stroke="#C7E2D4" stroke-width="1.6"/><text x="70" y="488" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-weight="760" font-size="19" text-anchor="start" fill="#1C695E">КЛИЕНТ ОТМЕНЯЕТ</text><text x="70" y="524" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-weight="560" font-size="18" text-anchor="start" fill="#274B59">В срок → без изменения надёжности</text><text x="70" y="557" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-weight="560" font-size="18" text-anchor="start" fill="#274B59">После срока → снижается надёжность</text><text x="70" y="587" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-weight="460" font-size="16" text-anchor="start" fill="#5B7980">только зарегистрированного клиента</text><rect x="674" y="453" width="602" height="161" rx="18" fill="#F4EEFF" stroke="#DCCAF4" stroke-width="1.6"/><text x="700" y="488" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-weight="760" font-size="19" text-anchor="start" fill="#6E4C9E">ПРОДАВЕЦ ОТМЕНЯЕТ</text><text x="700" y="524" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-weight="540" font-size="17" text-anchor="start" fill="#3D4C68">Самостоятельный мастер → его надёжность</text><text x="700" y="558" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-weight="540" font-size="17" text-anchor="start" fill="#3D4C68">Компания → надёжность компании</text><text x="700" y="588" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-weight="460" font-size="16" text-anchor="start" fill="#77718C">Сотрудник не штрафуется автоматически</text><path d="M350 615 L350 660" stroke="#9DADC0" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><path d="M970 615 L970 660" stroke="#9DADC0" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><rect x="45" y="676" width="1231" height="110" rx="18" fill="#EEF5FB" stroke="#CDDDEA" stroke-width="1.6"/><text x="660" y="717" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-weight="800" font-size="21" text-anchor="middle" fill="#194864">ПРИ ЛЮБОЙ ОТМЕНЕ — ДВА УВЕДОМЛЕНИЯ</text><text x="660" y="747" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-weight="510" font-size="16" text-anchor="middle" fill="#49697D">Подтверждение инициатору + уведомление второй стороне · outbox, повторные отправки</text><text x="660" y="824" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-weight="580" font-size="18" text-anchor="middle" fill="#314F65">События можно оспорить. Качественные отзывы и их звёзды не меняются.</text><text x="660" y="853" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-weight="460" font-size="16" text-anchor="middle" fill="#697F90">Отмена остаётся возможной даже после дедлайна. Денежных штрафов в Services нет.</text></svg>