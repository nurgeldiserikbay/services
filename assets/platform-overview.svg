<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-labelledby="chart-title chart-desc" viewBox="0 0 1340 970" width="1340" height="970"><title id="chart-title">Общая схема платформы Services</title><desc id="chart-desc">Открытый поиск без регистрации, самостоятельные специалисты, компании, независимые предложения и отзывы.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#9DAFC2"/></marker></defs><rect width="1340" height="970" fill="#F8FAFC"/><text x="56" y="64" font-family="Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="31" font-weight="750" fill="#102B46" text-anchor="start">SERVICES / КАК УСТРОЕНА ПЛАТФОРМА</text><text x="56" y="95" font-family="Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" font-weight="450" fill="#567086" text-anchor="start">Клиенту — простой поиск, продавцу — настраиваемые услуги, платформе — доверие и безопасность.</text><rect x="56" y="137" width="374" height="177" rx="20" fill="#ECF8F5" stroke="#B6E0D5" stroke-width="1.5"/><text x="78" y="168" font-family="Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="14" font-weight="800" fill="#516D83" text-anchor="start">КЛИЕНТ</text><text x="78" y="204" font-family="Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="22" font-weight="740" fill="#19354C" text-anchor="start">Ищет без регистрации</text><text x="78" y="246" font-family="Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#52677A" text-anchor="start">Город и услуга → карточка → обращение</text><text x="78" y="273" font-family="Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#52677A" text-anchor="start">Гостевой запрос или звонок / мессенджер</text><rect x="482" y="137" width="374" height="177" rx="20" fill="#EEF5FF" stroke="#BCD8F9" stroke-width="1.5"/><text x="504" y="168" font-family="Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="14" font-weight="800" fill="#516D83" text-anchor="start">СПЕЦИАЛИСТ</text><text x="504" y="204" font-family="Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="22" font-weight="740" fill="#19354C" text-anchor="start">Владеет профилями профессий</text><text x="504" y="246" font-family="Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#52677A" text-anchor="start">Собственные услуги и контакты</text><text x="504" y="273" font-family="Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#52677A" text-anchor="start">Может работать в нескольких компаниях</text><rect x="908" y="137" width="374" height="177" rx="20" fill="#F4F0FF" stroke="#DBCBFA" stroke-width="1.5"/><text x="930" y="168" font-family="Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="14" font-weight="800" fill="#516D83" text-anchor="start">КОМПАНИЯ</text><text x="930" y="204" font-family="Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="22" font-weight="740" fill="#19354C" text-anchor="start">Владеет организацией</text><text x="930" y="246" font-family="Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#52677A" text-anchor="start">Филиалы, команда и корпоративные услуги</text><text x="930" y="273" font-family="Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#52677A" text-anchor="start">Сотрудники подтверждают связи и назначения</text><path d="M 243 315 L 243 355" fill="none" stroke="#9DAFC2" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 669 315 L 669 355" fill="none" stroke="#9DAFC2" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 1095 315 L 1095 355" fill="none" stroke="#9DAFC2" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="56" y="370" width="1226" height="130" rx="20" fill="#FFFFFF" stroke="#D3DEE9" stroke-width="1.5"/><text x="86" y="408" font-family="Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" fill="#14324D" text-anchor="start">ОТКРЫТЫЙ КАТАЛОГ И ПОИСК</text><text x="86" y="439" font-family="Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" font-weight="500" fill="#476276" text-anchor="start">Профессии → специализации → типы услуг → предложения конкретных продавцов</text><text x="86" y="466" font-family="Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#476276" text-anchor="start">По умолчанию местный город · можно выбрать любую страну, регион или онлайн · органическая выдача</text><path d="M 669 500 L 669 543" fill="none" stroke="#9DAFC2" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="56" y="556" width="1226" height="156" rx="20" fill="#EFF5FB" stroke="#C6D7E8" stroke-width="1.5"/><text x="86" y="594" font-family="Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" fill="#153951" text-anchor="start">ПРЕДЛОЖЕНИЕ УСЛУГИ / SERVICE OFFER</text><text x="86" y="625" font-family="Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" font-weight="650" fill="#213D55" text-anchor="start">Продавец: самостоятельный специалист ИЛИ компания (ровно один на предложение)</text><text x="86" y="655" font-family="Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#52697F" text-anchor="start">Исполнитель: специалист или команда · цена, валюта, адрес/выезд/онлайн, правила отмены</text><text x="86" y="682" font-family="Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#52697F" text-anchor="start">Каналы: звонок · мессенджер · заявка · расчёт · необязательный календарь</text><path d="M 669 713 L 669 754" fill="none" stroke="#9DAFC2" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="56" y="767" width="584" height="111" rx="18" fill="#ECF8F5" stroke="#B8E0D4" stroke-width="1.5"/><text x="83" y="798" font-family="Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" font-weight="750" fill="#176C61" text-anchor="start">САМОСТОЯТЕЛЬНЫЙ ПРОДАВЕЦ</text><text x="83" y="828" font-family="Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#304C5C" text-anchor="start">Сам решает: принять, предложить условия, отклонить</text><text x="83" y="853" font-family="Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#52697F" text-anchor="start">Сам отвечает за своё предложение и обслуживание</text><rect x="698" y="767" width="584" height="111" rx="18" fill="#F4F0FF" stroke="#D5C4F8" stroke-width="1.5"/><text x="725" y="798" font-family="Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" font-weight="750" fill="#6C4FA3" text-anchor="start">КОРПОРАТИВНЫЙ ПРОДАВЕЦ</text><text x="725" y="828" font-family="Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#304C5C" text-anchor="start">Решает компания или уполномоченный оператор</text><text x="725" y="853" font-family="Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#52697F" text-anchor="start">Мастер выполняет работу по согласованному назначению</text><text x="669" y="917" font-family="Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" font-weight="660" fill="#344E63" text-anchor="middle">Заявка → подтверждение → выполнение → отдельные отзывы специалисту и компании</text><text x="669" y="943" font-family="Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="15" font-weight="450" fill="#657B8D" text-anchor="middle">Платформа: авторизация владельцев, защита персональных данных, модерация, аудит</text></svg>