name: Validate documentation HTML
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'contracts/**'
      - 'scripts/**'
      - 'index.html'
      - 'README.md'
      - 'AGENTS.md'
      - '.github/workflows/deploy-docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'contracts/**'
      - 'scripts/**'
      - 'index.html'
      - 'README.md'
      - 'AGENTS.md'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild standalone HTML from Markdown
        run: node scripts/build-site.mjs
      - name: Ensure committed HTML matches source docs
        run: git diff --exit-code -- index.html
      - name: Check documentation structure
        run: node scripts/check-docs.mjs
