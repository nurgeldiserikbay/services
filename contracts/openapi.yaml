openapi: 3.1.0
info:
  title: Services API — initial contract
  version: 0.3.0
  description: >
    Частичный проектный контракт API для простых заявок, публичного каталога и персональных закладок. На момент создания не означает,
    что эти маршруты реализованы. Все серверные операции дополнительно проверяют ACL.
servers:
  - url: https://api.example.invalid/v1
    description: Placeholder; not an actual API
tags:
  - name: Identity
  - name: Geography
  - name: Professionals
  - name: Organizations
  - name: Bookings
  - name: Reviews
paths:
  /me:
    get:
      tags: [Identity]
      operationId: getMe
      summary: Получить свою учётную запись
      security:
        - sessionAuth: []
      responses:
        '200':
          description: User workspace summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/professional-profiles:
    get:
      tags: [Professionals]
      operationId: listMyProfessionalProfiles
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Own professional identities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProfessionalProfile'
    post:
      tags: [Professionals]
      operationId: createProfessionalProfile
      summary: Одна страница на одну каноническую профессию
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProfessionalProfile'
      responses:
        '201':
          description: Created profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfessionalProfile'
        '409':
          $ref: '#/components/responses/Conflict'
  /me/professional-profiles/{id}/lifecycle:
    post:
      tags: [Professionals]
      operationId: transitionProfessionalProfile
      summary: Архив, пауза, скрытие, восстановление и удаление
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [publish, pause, hide, archive, restore, request_deletion, cancel_deletion]
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfessionalProfile'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /professionals/{slug}:
    get:
      tags: [Professionals]
      operationId: getPublicProfessional
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Public professional details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfessionalProfile'
        '404':
          $ref: '#/components/responses/NotFound'
  /organizations/{id}/affiliation-invites:
    post:
      tags: [Organizations]
      operationId: inviteProfessional
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [professional_profile_id, relation_type]
              properties:
                professional_profile_id:
                  type: string
                  format: uuid
                relation_type:
                  type: string
                  enum: [employee, contractor, renter, partner]
      responses:
        '201':
          description: Invitation created
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id:
                    type: string
                    format: uuid
                  status:
                    const: pending
        '403':
          $ref: '#/components/responses/Forbidden'
  /bookings:
    post:
      tags: [Bookings]
      operationId: createSimpleRequest
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [service_offer_id]
              properties:
                service_offer_id:
                  type: string
                  format: uuid
                professional_profile_id:
                  type: [string, 'null']
                  format: uuid
                preferred_at:
                  type: [string, 'null']
                  format: date-time
                source_context:
                  type: string
                  enum: [personal, organization]
                  description: Server validates that context matches seller of offer
                note:
                  type: [string, 'null']
                  maxLength: 1000
      responses:
        '201':
          description: Booking created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '409':
          $ref: '#/components/responses/Conflict'
  /requests/{id}/accept:
    post:
      tags: [Bookings]
      operationId: acceptSimpleRequest
      summary: Продавец/уполномоченный оператор принимает заявку (без согласования цены)
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /requests/{id}/decline:
    post:
      tags: [Bookings]
      operationId: declineSimpleRequest
      summary: Продавец отклоняет заявку
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Declined
        '403':
          $ref: '#/components/responses/Forbidden'
  /requests/{id}/cancel:
    post:
      tags: [Bookings]
      operationId: cancelSimpleRequest
      summary: Отменить заявку, уведомить обе стороны и применить правила надёжности
      description: >
        Owner/guest capability checked by backend. Seller policy snapshot from accepted booking
        determines customer deadline; cancelled pending never lowers reliability.
        Two notification intents are atomically recorded; delivery happens asynchronously.
      security:
        - sessionAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: Guest-Capability
          in: header
          required: false
          description: Scoped authorization for verified guest cancelling own request
          schema:
            type: string
        - name: If-Match
          in: header
          required: false
          description: Expected current request version, checked with idempotent cancellation
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason_code:
                  type: string
                  enum: [changed_plans, seller_unavailable, customer_unavailable, schedule_changed, agreed_mutual, other]
      responses:
        '200':
          description: Cancelled; both notification intents queued, delivery not yet guaranteed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancellationResult'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /requests/{id}/cancellation-preview:
    get:
      tags: [Bookings]
      operationId: getCancellationPreview
      summary: Preview cancellation deadline and possible reliability change
      description: Private preview is informative only; server recomputes on POST cancel
      security:
        - sessionAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: Guest-Capability
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Eligibility and deadline, without private data of other participants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancellationPreview'
        '403':
          $ref: '#/components/responses/Forbidden'
  /service-offers/{id}/cancellation-policy:
    get:
      tags: [Bookings]
      operationId: getOfferCancellationPolicy
      summary: Public policy set by seller, before consumer chooses service
      security: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Cancellation terms in the offer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancellationPolicy'
    put:
      tags: [Bookings]
      operationId: setOfferCancellationPolicy
      summary: Seller updates future cancellation terms, not already accepted requests
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [free_cancel_before_minutes]
              additionalProperties: false
              properties:
                free_cancel_before_minutes:
                  type: integer
                  minimum: 0
                  maximum: 10080
      responses:
        '200':
          description: New policy version for future bookings only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancellationPolicy'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /me/reliability:
    get:
      tags: [Identity]
      operationId: getMyCustomerReliability
      summary: Customer reliability and event summary, separate from reviews
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Private score explanation and appeal instructions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReliabilitySummary'
  /sellers/{kind}/{id}/reliability:
    get:
      tags: [Bookings]
      operationId: getSellerReliability
      summary: Publication-safe provider reliability, independent from review stars
      security: []
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum: [professional, organization]
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Public summary with insufficient-data suppression
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReliabilitySummary'
  /reliability-events/{id}/appeal:
    post:
      tags: [Bookings]
      operationId: appealReliabilityEvent
      summary: Challenge own reliability event; no automatic public penalty during pending review
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason:
                  type: string
                  maxLength: 800
      responses:
        '202':
          description: Human review requested
        '403':
          $ref: '#/components/responses/Forbidden'
  /me/saved-items:
    get:
      tags: [Identity]
      operationId: listSavedItems
      summary: Мои сохранённые страницы, доступно после входа
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Private saved items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SavedItem'
    post:
      tags: [Identity]
      operationId: saveItem
      summary: Добавить страницу в избранное
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavedItem'
      responses:
        '201':
          description: Saved
  /organizations/{id}/professionals/{profile_id}:
    get:
      tags: [Organizations]
      operationId: getCompanyProfessionalView
      summary: Публичное двусторонне разрешённое представление мастера в компании
      security: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: profile_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Only intersection of master allowlist, company choice and platform policy
        '404':
          $ref: '#/components/responses/NotFound'
  /experiences/{id}/reviews:
    post:
      tags: [Reviews]
      operationId: createExperienceReview
      summary: Раздельный отзыв участнику подтверждённого визита
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReview'
      responses:
        '201':
          description: Review created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /geo/countries:
    get:
      tags: [Geography]
      operationId: listCountries
      security: []
      responses:
        '200':
          description: ISO 3166-1 countries with stable internal identifiers
  /geo/areas:
    get:
      tags: [Geography]
      operationId: listAreas
      security: []
      parameters:
        - in: query
          name: country_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Regions/states within selected country
  /geo/cities:
    get:
      tags: [Geography]
      operationId: searchCities
      security: []
      parameters:
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: country_id
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Matching cities with stable IDs, countries, areas and IANA timezones
  /geo/suggestion:
    get:
      tags: [Geography]
      operationId: suggestGeo
      security: []
      responses:
        '200':
          description: Approximate country/city suggestion, not precise GPS and may be unavailable
  /search:
    get:
      tags: [Professionals, Organizations]
      operationId: searchPublicMarketplace
      summary: Публичный поиск услуг, специалистов и компаний без регистрации
      security: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 180
        - name: kind
          in: query
          schema:
            type: string
            enum: [all, professional, organization, offer]
        - name: city_id
          in: query
          schema:
            type: string
            format: uuid
        - name: area_id
          in: query
          schema:
            type: string
            format: uuid
        - name: country_id
          in: query
          schema:
            type: string
            format: uuid
        - name: scope
          in: query
          schema:
            type: string
            enum: [city, area, country, global]
        - name: delivery_mode
          in: query
          schema:
            type: string
            enum: [any, at_location, at_customer, online]
      responses:
        '200':
          description: Only published public results; sponsored results must carry an explicit label
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [kind, id, title, is_sponsored]
                      properties:
                        kind:
                          type: string
                          enum: [professional, organization, offer]
                        id:
                          type: string
                          format: uuid
                        title:
                          type: string
                        is_sponsored:
                          type: boolean
                  next_cursor:
                    type: [string, 'null']
  /guest-inquiries/challenges:
    post:
      tags: [Bookings]
      operationId: requestGuestContactChallenge
      summary: Отправить одноразовый код для гостевого обращения, не создавая аккаунт
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [channel, contact]
              properties:
                channel:
                  type: string
                  enum: [sms, email]
                contact:
                  type: string
                  maxLength: 320
      responses:
        '202':
          description: Generic response to avoid account enumeration
          content:
            application/json:
              schema:
                type: object
                required: [challenge_id]
                properties:
                  challenge_id:
                    type: string
                    format: uuid
        '429':
          description: Rate limit exceeded
  /guest-inquiries/challenges/{id}/verify:
    post:
      tags: [Bookings]
      operationId: verifyGuestContactChallenge
      summary: Подтвердить канал для конкретной гостевой заявки
      security: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              additionalProperties: false
              properties:
                code:
                  type: string
                  minLength: 4
                  maxLength: 12
      responses:
        '200':
          description: Short-lived scoped capability; never expose via URL or logs
          content:
            application/json:
              schema:
                type: object
                required: [guest_capability, expires_at]
                properties:
                  guest_capability:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
        '429':
          description: Too many attempts
  /guest-inquiries:
    post:
      tags: [Bookings]
      operationId: createGuestInquiry
      summary: Простая заявка без постоянного аккаунта
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: Guest-Capability
          in: header
          required: true
          schema:
            type: string
          description: Scoped, short-lived proof from guest contact verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [service_offer_id, consent_to_contact]
              additionalProperties: false
              properties:
                service_offer_id:
                  type: string
                  format: uuid
                note:
                  type: string
                  maxLength: 1000
                consent_to_contact:
                  type: boolean
                  const: true
      responses:
        '201':
          description: Guest inquiry submitted without User account
          content:
            application/json:
              schema:
                type: object
                required: [id, state]
                properties:
                  id:
                    type: string
                    format: uuid
                  state:
                    const: pending
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

components:
  securitySchemes:
    sessionAuth:
      type: http
      scheme: bearer
      bearerFormat: AccessToken
      description: >
        Representative contract for mobile; web cookie session may differ
        and requires a separate approved authentication ADR.
  parameters:
    ResourceId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
  schemas:
    Country:
      type: object
      required: [id, code, name]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
    City:
      type: object
      required: [id, name, country_id]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        country_id:
          type: string
          format: uuid
        area_id:
          type: [string, 'null']
          format: uuid
        timezone:
          type: [string, 'null']
    GeoSuggestion:
      type: object
      properties:
        country_id:
          type: [string, 'null']
          format: uuid
        city_id:
          type: [string, 'null']
          format: uuid
        confidence:
          type: string
          enum: [low, medium]
    MeResponse:
      type: object
      required: [user_id, person_id]
      properties:
        user_id:
          type: string
          format: uuid
        person_id:
          type: string
          format: uuid
        workspace_ids:
          type: array
          items:
            type: string
            format: uuid
    ProfessionalProfile:
      type: object
      required: [id, profession_id, lifecycle_status]
      properties:
        id:
          type: string
          format: uuid
        profession_id:
          type: string
          format: uuid
        lifecycle_status:
          type: string
          enum: [draft, published, paused, hidden, archived, pending_deletion, erased]
        slug:
          type: [string, 'null']
        version:
          type: integer
          minimum: 1
    CreateProfessionalProfile:
      type: object
      additionalProperties: false
      required: [profession_id]
      properties:
        profession_id:
          type: string
          format: uuid
        preferred_slug:
          type: string
          maxLength: 100
    CancellationPolicy:
      type: object
      required: [offer_id, free_cancel_before_minutes, revision]
      properties:
        offer_id:
          type: string
          format: uuid
        free_cancel_before_minutes:
          type: integer
          minimum: 0
          maximum: 10080
        revision:
          type: integer
          minimum: 1
    CancellationPreview:
      type: object
      required: [request_id, current_status, timezone, reliability_may_change]
      properties:
        request_id:
          type: string
          format: uuid
        current_status:
          type: string
        scheduled_start_at:
          type: [string, 'null']
          format: date-time
        free_cancel_until:
          type: [string, 'null']
          format: date-time
        policy_revision:
          type: [integer, 'null']
        warning_kind:
          type: string
          enum: [none, late_customer, provider_cancel]
        reliability_may_change:
          type: boolean
        timezone:
          type: string
    CancellationResult:
      type: object
      required: [request_id, status, cancelled_at, reliability_event_state, notification_state]
      properties:
        request_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [cancelled_by_customer, cancelled_by_provider, cancelled_mutual]
        cancelled_at:
          type: string
          format: date-time
        reliability_event_state:
          type: string
          enum: [none, proposed, effective]
        notification_state:
          type: string
          const: queued
        version:
          type: integer
          minimum: 1
    ReliabilitySummary:
      type: object
      required: [subject_kind, period_days, formula_version, sample_size, has_enough_data, negative_event_count]
      properties:
        subject_kind:
          type: string
          enum: [customer, professional, organization]
        period_days:
          type: integer
          const: 180
        formula_version:
          type: string
        score:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
        sample_size:
          type: integer
          minimum: 0
        has_enough_data:
          type: boolean
        negative_event_count:
          type: integer
          minimum: 0
        updated_at:
          type: [string, 'null']
          format: date-time
    Booking:
      type: object
      description: Draft contract for simple request; legacy name retained until API naming is standardized.
      required: [id, state, service_offer_id]
      properties:
        id:
          type: string
          format: uuid
        state:
          type: string
          enum: [pending, accepted, declined, completed, cancelled_by_customer, cancelled_by_provider, cancelled_mutual, expired]
        service_offer_id:
          type: string
          format: uuid
    SavedItem:
      type: object
      required: [target_kind, target_id]
      properties:
        target_kind:
          type: string
          enum: [professional, organization, location, offer]
        target_id:
          type: string
          format: uuid
    CreateReview:
      type: object
      additionalProperties: false
      required: [target_kind, target_id, rating]
      properties:
        target_kind:
          type: string
          enum: [professional, organization, location]
        target_id:
          type: string
          format: uuid
        rating:
          type: integer
          minimum: 1
          maximum: 5
        text:
          type: string
          maxLength: 3000
    Review:
      allOf:
        - $ref: '#/components/schemas/CreateReview'
        - type: object
          required: [id, experience_id, status]
          properties:
            id:
              type: string
              format: uuid
            experience_id:
              type: string
              format: uuid
            status:
              type: string
              enum: [submitted, published, under_review, hidden, removed]
    ApiError:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
        details:
          type: object
          additionalProperties: true
  responses:
    Unauthorized:
      description: Not authenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Insufficient resource permission
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Duplicate or invalid concurrent transition
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Resource not public or not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
