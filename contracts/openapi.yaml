openapi: 3.1.0
info:
  title: Services API — initial contract
  version: 0.4.0
  description: >
    Частичный проектный контракт API для простых заявок, публичного каталога и персональных закладок. На момент создания не означает,
    что эти маршруты реализованы. Все серверные операции дополнительно проверяют ACL.
servers:
  - url: https://api.example.invalid/v1
    description: Placeholder; not an actual API
tags:
  - name: Identity
  - name: Geography
  - name: Professionals
  - name: Organizations
  - name: Bookings
  - name: Reviews
paths:
  /professions:
    get:
      tags: [Professionals]
      operationId: listProfessions
      summary: Публичная каноническая таксономия профессий
      security: []
      parameters:
        - name: q
          in: query
          schema: {type: string, maxLength: 120}
        - name: locale
          in: query
          schema: {type: string, maxLength: 12}
      responses:
        '200':
          description: Canonical professions, not duplicate professional identities
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/TaxonomyItem'}
  /service-definitions:
    get:
      tags: [Professionals]
      operationId: listServiceDefinitions
      summary: Публичные виды услуг, независимо от цены и продавца
      security: []
      parameters:
        - name: profession_id
          in: query
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: List of service definitions
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/TaxonomyItem'}
  /organizations:
    post:
      tags: [Organizations]
      operationId: createOrganization
      summary: Создать организацию в статусе draft; verification required to claim real business
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganization'
      responses:
        '201':
          description: Created draft, not verified automatically
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '409':
          $ref: '#/components/responses/Conflict'
  /organizations/{id}:
    get:
      tags: [Organizations]
      operationId: getOrganizationPublic
      security: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Published company profile, excludes private owner contacts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '404':
          $ref: '#/components/responses/NotFound'
  /me/professional-profiles/{id}:
    patch:
      tags: [Professionals]
      operationId: updateOwnProfessionalProfile
      summary: Owner edits own professional page, not any company version
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: If-Match
          in: header
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                title: {type: string, maxLength: 180}
                about: {type: string, maxLength: 3000}
      responses:
        '200':
          description: Updated owner profile; version incremented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfessionalProfile'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /professional-profiles/{id}/company-views/{organization_id}/permissions:
    put:
      tags: [Professionals]
      operationId: setCompanyFieldsAllowedByProfessional
      summary: Мастер разрешает поля своей страницы конкретной компании
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: organization_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: If-Match
          in: header
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyFieldsPermission'
      responses:
        '200':
          description: New master allowlist revision; published caches invalidated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyFieldsPermission'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /organizations/{id}/professionals/{profile_id}/view:
    put:
      tags: [Organizations]
      operationId: setCompanyProfessionalView
      summary: Компания выбирает подмножество разрешённых мастером полей и корпоративное оформление
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: profile_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: If-Match
          in: header
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyProfessionalViewUpdate'
      responses:
        '200':
          description: Published view contains only intersection of permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyProfessionalView'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /service-offers:
    post:
      tags: [Professionals]
      operationId: createServiceOffer
      summary: Продавец создаёт услугу с простым приёмом заявок и необязательной ценой
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServiceOffer'
      responses:
        '201':
          description: Created offer draft; seller chosen once, server validates ownership
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOffer'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /service-offers/{id}:
    get:
      tags: [Professionals]
      operationId: getPublishedServiceOffer
      summary: Публичная услуга с реальным продавцом и доступными каналами
      security: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Published public offer only, excludes hidden private contacts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOffer'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Professionals]
      operationId: updateServiceOffer
      summary: Seller updates draft or future terms without changing seller of existing requests
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: If-Match
          in: header
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                title: {type: string, maxLength: 200}
                contact_methods:
                  type: array
                  uniqueItems: true
                  minItems: 1
                  items: {type: string, enum: [phone, whatsapp, guest_request, book_slot]}
                availability_visibility: {type: string, enum: [hidden, busy_only, free_slots]}
                price_label: {type: [string, 'null'], maxLength: 160}
      responses:
        '200':
          description: Updated offer revision; existing request terms unaffected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOffer'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /requests:
    post:
      tags: [Bookings]
      operationId: createServiceRequest
      summary: Простая заявка авторизованного клиента; гость использует verified guest route
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServiceRequest'
      responses:
        '201':
          description: Pending request received by the server-resolved seller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /requests/{id}:
    get:
      tags: [Bookings]
      operationId: getOwnServiceRequest
      summary: Клиент/продавец видит только свою заявку; гость — по проверенному доступу
      security:
        - sessionAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: Guest-Capability
          in: header
          required: false
          schema: {type: string}
      responses:
        '200':
          description: Scoped private request detail, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /requests/{id}/complete:
    post:
      tags: [Bookings]
      operationId: completeServiceRequest
      summary: Продавец отмечает выполнение; это ещё не verified review
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Request marked complete, customer can confirm experience separately
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '403':
          $ref: '#/components/responses/Forbidden'
  /requests/{id}/schedule:
    patch:
      tags: [Bookings]
      operationId: changeServiceRequestSchedule
      summary: Продавец отмечает договорённое вне платформы время; уведомление клиенту обязательно
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: If-Match
          in: header
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleUpdate'
      responses:
        '200':
          description: Updated schedule and notification intent, previous deadline not silently reused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '403':
          $ref: '#/components/responses/Forbidden'
  /me/requests:
    get:
      tags: [Bookings]
      operationId: getMyCustomerRequests
      summary: Приватная история заявок авторизованного клиента
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Customer-owned requests, cursor pagination to implement
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ServiceRequest'}
  /me/availability-allocations:
    get:
      tags: [Bookings]
      operationId: listMyWorkAllocations
      summary: Мои личные и согласованные корпоративные часы
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Only owned professional allocations, excluding details of other contexts
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/WorkAllocation'}
    put:
      tags: [Bookings]
      operationId: setMyWorkAllocation
      summary: Мастер предлагает персональное или корпоративное время
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkAllocation'
      responses:
        '200':
          description: Personal allocation active; company allocation requires company approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkAllocation'
        '403':
          $ref: '#/components/responses/Forbidden'
  /public-availability:
    get:
      tags: [Bookings]
      operationId: getPublicOfferAvailability
      summary: Only published free slots or busy indicator when seller opted in
      security: []
      parameters:
        - name: offer_id
          in: query
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Does not reveal where/with whom a professional is busy elsewhere
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicAvailability'
  /me/notifications:
    get:
      tags: [Identity]
      operationId: listMyNotifications
      summary: Частные уведомления, отдельные от статуса фактической доставки
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Private notifications
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/NotificationSummary'}
  /me/saved-items/{id}:
    delete:
      tags: [Identity]
      operationId: removeSavedItem
      summary: Удалить свою закладку, не влияя на чужие профили
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: Removed
        '403':
          $ref: '#/components/responses/Forbidden'
  /me:
    get:
      tags: [Identity]
      operationId: getMe
      summary: Получить свою учётную запись
      security:
        - sessionAuth: []
      responses:
        '200':
          description: User workspace summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/professional-profiles:
    get:
      tags: [Professionals]
      operationId: listMyProfessionalProfiles
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Own professional identities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProfessionalProfile'
    post:
      tags: [Professionals]
      operationId: createProfessionalProfile
      summary: Одна страница на одну каноническую профессию
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProfessionalProfile'
      responses:
        '201':
          description: Created profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfessionalProfile'
        '409':
          $ref: '#/components/responses/Conflict'
  /me/professional-profiles/{id}/lifecycle:
    post:
      tags: [Professionals]
      operationId: transitionProfessionalProfile
      summary: Архив, пауза, скрытие, восстановление и удаление
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [publish, pause, hide, archive, restore, request_deletion, cancel_deletion]
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfessionalProfile'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /professionals/{slug}:
    get:
      tags: [Professionals]
      operationId: getPublicProfessional
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Public professional details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfessionalProfile'
        '404':
          $ref: '#/components/responses/NotFound'
  /organizations/{id}/affiliation-invites:
    post:
      tags: [Organizations]
      operationId: inviteProfessional
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [professional_profile_id, relation_type]
              properties:
                professional_profile_id:
                  type: string
                  format: uuid
                relation_type:
                  type: string
                  enum: [employee, contractor, renter, partner]
      responses:
        '201':
          description: Invitation created
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id:
                    type: string
                    format: uuid
                  status:
                    const: pending
        '403':
          $ref: '#/components/responses/Forbidden'
  /bookings:
    post:
      deprecated: true
      tags: [Bookings]
      operationId: createSimpleRequest
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [service_offer_id]
              properties:
                service_offer_id:
                  type: string
                  format: uuid
                professional_profile_id:
                  type: [string, 'null']
                  format: uuid
                preferred_at:
                  type: [string, 'null']
                  format: date-time
                source_context:
                  type: string
                  enum: [personal, organization]
                  description: Server validates that context matches seller of offer
                note:
                  type: [string, 'null']
                  maxLength: 1000
      responses:
        '201':
          description: Booking created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /requests/{id}/accept:
    post:
      tags: [Bookings]
      operationId: acceptSimpleRequest
      summary: Продавец/уполномоченный оператор принимает заявку (без согласования цены)
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /requests/{id}/decline:
    post:
      tags: [Bookings]
      operationId: declineSimpleRequest
      summary: Продавец отклоняет заявку
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Declined
        '403':
          $ref: '#/components/responses/Forbidden'
  /requests/{id}/cancel:
    post:
      tags: [Bookings]
      operationId: cancelSimpleRequest
      summary: Отменить заявку, уведомить обе стороны и применить правила надёжности
      description: >
        Owner/guest capability checked by backend. Seller policy snapshot from accepted booking
        determines customer deadline; cancelled pending never lowers reliability.
        Two notification intents are atomically recorded; delivery happens asynchronously.
      security:
        - sessionAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: Guest-Capability
          in: header
          required: false
          description: Scoped authorization for verified guest cancelling own request
          schema:
            type: string
        - name: If-Match
          in: header
          required: false
          description: Expected current request version, checked with idempotent cancellation
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason_code:
                  type: string
                  enum: [changed_plans, seller_unavailable, customer_unavailable, schedule_changed, agreed_mutual, other]
      responses:
        '200':
          description: Cancelled; both notification intents queued, delivery not yet guaranteed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancellationResult'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /requests/{id}/cancellation-preview:
    get:
      tags: [Bookings]
      operationId: getCancellationPreview
      summary: Preview cancellation deadline and possible reliability change
      description: Private preview is informative only; server recomputes on POST cancel
      security:
        - sessionAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: Guest-Capability
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Eligibility and deadline, without private data of other participants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancellationPreview'
        '403':
          $ref: '#/components/responses/Forbidden'
  /service-offers/{id}/cancellation-policy:
    get:
      tags: [Bookings]
      operationId: getOfferCancellationPolicy
      summary: Public policy set by seller, before consumer chooses service
      security: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Cancellation terms in the offer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancellationPolicy'
    put:
      tags: [Bookings]
      operationId: setOfferCancellationPolicy
      summary: Seller updates future cancellation terms, not already accepted requests
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [free_cancel_before_minutes]
              additionalProperties: false
              properties:
                free_cancel_before_minutes:
                  type: integer
                  minimum: 0
                  maximum: 10080
      responses:
        '200':
          description: New policy version for future bookings only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancellationPolicy'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /me/reliability:
    get:
      tags: [Identity]
      operationId: getMyCustomerReliability
      summary: Customer reliability and event summary, separate from reviews
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Private score explanation and appeal instructions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReliabilitySummary'
  /sellers/{kind}/{id}/reliability:
    get:
      tags: [Bookings]
      operationId: getSellerReliability
      summary: Publication-safe provider reliability, independent from review stars
      security: []
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum: [professional, organization]
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Public summary with insufficient-data suppression
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReliabilitySummary'
  /reliability-events/{id}/appeal:
    post:
      tags: [Bookings]
      operationId: appealReliabilityEvent
      summary: Challenge own reliability event; no automatic public penalty during pending review
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason:
                  type: string
                  maxLength: 800
      responses:
        '202':
          description: Human review requested
        '403':
          $ref: '#/components/responses/Forbidden'
  /me/saved-items:
    get:
      tags: [Identity]
      operationId: listSavedItems
      summary: Мои сохранённые страницы, доступно после входа
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Private saved items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SavedItem'
    post:
      tags: [Identity]
      operationId: saveItem
      summary: Добавить страницу в избранное
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavedItem'
      responses:
        '201':
          description: Saved
  /organizations/{id}/professionals/{profile_id}:
    get:
      tags: [Organizations]
      operationId: getCompanyProfessionalView
      summary: Публичное двусторонне разрешённое представление мастера в компании
      security: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: profile_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Only intersection of master allowlist, company choice and platform policy
        '404':
          $ref: '#/components/responses/NotFound'
  /experiences/{id}/reviews:
    post:
      tags: [Reviews]
      operationId: createExperienceReview
      summary: Раздельный отзыв участнику подтверждённого визита
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReview'
      responses:
        '201':
          description: Review created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /geo/countries:
    get:
      tags: [Geography]
      operationId: listCountries
      security: []
      responses:
        '200':
          description: ISO 3166-1 countries with stable internal identifiers
  /geo/areas:
    get:
      tags: [Geography]
      operationId: listAreas
      security: []
      parameters:
        - in: query
          name: country_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Regions/states within selected country
  /geo/cities:
    get:
      tags: [Geography]
      operationId: searchCities
      security: []
      parameters:
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: country_id
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Matching cities with stable IDs, countries, areas and IANA timezones
  /geo/suggestion:
    get:
      tags: [Geography]
      operationId: suggestGeo
      security: []
      responses:
        '200':
          description: Approximate country/city suggestion, not precise GPS and may be unavailable
  /search:
    get:
      tags: [Professionals, Organizations]
      operationId: searchPublicMarketplace
      summary: Публичный поиск услуг, специалистов и компаний без регистрации
      security: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 180
        - name: kind
          in: query
          schema:
            type: string
            enum: [all, professional, organization, offer]
        - name: city_id
          in: query
          schema:
            type: string
            format: uuid
        - name: area_id
          in: query
          schema:
            type: string
            format: uuid
        - name: country_id
          in: query
          schema:
            type: string
            format: uuid
        - name: scope
          in: query
          schema:
            type: string
            enum: [city, area, country, global]
        - name: delivery_mode
          in: query
          schema:
            type: string
            enum: [any, at_location, at_customer, online]
      responses:
        '200':
          description: Only published public results; sponsored results must carry an explicit label
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [kind, id, title, is_sponsored]
                      properties:
                        kind:
                          type: string
                          enum: [professional, organization, offer]
                        id:
                          type: string
                          format: uuid
                        title:
                          type: string
                        is_sponsored:
                          type: boolean
                  next_cursor:
                    type: [string, 'null']
  /guest-inquiries/challenges:
    post:
      tags: [Bookings]
      operationId: requestGuestContactChallenge
      summary: Отправить одноразовый код для гостевого обращения, не создавая аккаунт
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [channel, contact]
              properties:
                channel:
                  type: string
                  enum: [sms, email]
                contact:
                  type: string
                  maxLength: 320
      responses:
        '202':
          description: Generic response to avoid account enumeration
          content:
            application/json:
              schema:
                type: object
                required: [challenge_id]
                properties:
                  challenge_id:
                    type: string
                    format: uuid
        '429':
          description: Rate limit exceeded
  /guest-inquiries/challenges/{id}/verify:
    post:
      tags: [Bookings]
      operationId: verifyGuestContactChallenge
      summary: Подтвердить канал для конкретной гостевой заявки
      security: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              additionalProperties: false
              properties:
                code:
                  type: string
                  minLength: 4
                  maxLength: 12
      responses:
        '200':
          description: Short-lived scoped capability; never expose via URL or logs
          content:
            application/json:
              schema:
                type: object
                required: [guest_capability, expires_at]
                properties:
                  guest_capability:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
        '429':
          description: Too many attempts
  /guest-inquiries:
    post:
      tags: [Bookings]
      operationId: createGuestInquiry
      summary: Простая заявка без постоянного аккаунта
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: Guest-Capability
          in: header
          required: true
          schema:
            type: string
          description: Scoped, short-lived proof from guest contact verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [service_offer_id, consent_to_contact]
              additionalProperties: false
              properties:
                service_offer_id:
                  type: string
                  format: uuid
                note:
                  type: string
                  maxLength: 1000
                consent_to_contact:
                  type: boolean
                  const: true
      responses:
        '201':
          description: Guest inquiry submitted without User account
          content:
            application/json:
              schema:
                type: object
                required: [id, state]
                properties:
                  id:
                    type: string
                    format: uuid
                  state:
                    const: pending
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

components:
  securitySchemes:
    sessionAuth:
      type: http
      scheme: bearer
      bearerFormat: AccessToken
      description: >
        Representative contract for mobile; web cookie session may differ
        and requires a separate approved authentication ADR.
  parameters:
    ResourceId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
  schemas:
    TaxonomyItem:
      type: object
      required: [id, code, name]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        name: {type: string}
    CreateOrganization:
      type: object
      additionalProperties: false
      required: [name, slug]
      properties:
        name: {type: string, minLength: 2, maxLength: 200}
        slug: {type: string, minLength: 3, maxLength: 160}
    Organization:
      type: object
      required: [id, slug, name, status]
      properties:
        id: {type: string, format: uuid}
        slug: {type: string}
        name: {type: string}
        status: {type: string, enum: [draft, active, suspended, closed]}
    CompanyFieldsPermission:
      type: object
      additionalProperties: false
      required: [allowed_fields]
      properties:
        allowed_fields:
          type: array
          uniqueItems: true
          items: {type: string}
          description: Versioned field allowlist; server validates registered field keys
    CompanyProfessionalViewUpdate:
      type: object
      additionalProperties: false
      required: [selected_fields]
      properties:
        selected_fields:
          type: array
          uniqueItems: true
          items: {type: string}
        corporate_role: {type: [string, 'null'], maxLength: 160}
    CompanyProfessionalView:
      type: object
      required: [organization_id, professional_id, visible_fields, revision]
      properties:
        organization_id: {type: string, format: uuid}
        professional_id: {type: string, format: uuid}
        visible_fields:
          type: array
          items: {type: string}
        revision: {type: integer, minimum: 1}
    CreateServiceOffer:
      type: object
      additionalProperties: false
      required: [definition_id, title, seller_kind, seller_id, contact_methods]
      properties:
        definition_id: {type: string, format: uuid}
        title: {type: string, maxLength: 200}
        seller_kind: {type: string, enum: [professional, organization]}
        seller_id: {type: string, format: uuid}
        contact_methods:
          type: array
          uniqueItems: true
          minItems: 1
          items: {type: string, enum: [phone, whatsapp, guest_request, book_slot]}
        delivery_mode: {type: string, enum: [at_location, at_customer, online, hybrid]}
        city_id: {type: [string, 'null'], format: uuid}
        price_label: {type: [string, 'null'], maxLength: 160}
        availability_visibility: {type: string, enum: [hidden, busy_only, free_slots]}
    ServiceOffer:
      type: object
      required: [id, title, seller_kind, seller_id, status, contact_methods]
      properties:
        id: {type: string, format: uuid}
        definition_id: {type: string, format: uuid}
        title: {type: string}
        seller_kind: {type: string, enum: [professional, organization]}
        seller_id: {type: string, format: uuid}
        status: {type: string, enum: [draft, published, paused, archived]}
        contact_methods:
          type: array
          items: {type: string, enum: [phone, whatsapp, guest_request, book_slot]}
        city_id: {type: [string, 'null'], format: uuid}
        price_label: {type: [string, 'null']}
        availability_visibility: {type: string, enum: [hidden, busy_only, free_slots]}
    CreateServiceRequest:
      type: object
      required: [service_offer_id, source_context]
      additionalProperties: false
      properties:
        service_offer_id: {type: string, format: uuid}
        source_context: {type: string, enum: [personal, organization]}
        desired_start_at: {type: [string, 'null'], format: date-time}
        desired_end_at: {type: [string, 'null'], format: date-time}
        note: {type: [string, 'null'], maxLength: 1000}
      description: Seller is resolved from offer by backend, never taken from caller.
    ServiceRequest:
      type: object
      required: [id, service_offer_id, seller_kind, seller_id, source_context, state, version]
      properties:
        id: {type: string, format: uuid}
        service_offer_id: {type: string, format: uuid}
        seller_kind: {type: string, enum: [professional, organization]}
        seller_id: {type: string, format: uuid}
        source_context: {type: string, enum: [personal, organization]}
        state:
          type: string
          enum: [pending, accepted, declined, cancelled_by_customer, cancelled_by_provider, cancelled_mutual, completed, expired]
        scheduled_start_at: {type: [string, 'null'], format: date-time}
        scheduled_end_at: {type: [string, 'null'], format: date-time}
        version: {type: integer, minimum: 1}
    ScheduleUpdate:
      type: object
      required: [start_at, end_at, timezone]
      additionalProperties: false
      properties:
        start_at: {type: string, format: date-time}
        end_at: {type: string, format: date-time}
        timezone: {type: string, minLength: 1, maxLength: 64}
    WorkAllocation:
      type: object
      required: [professional_id, context, timezone, recurring_hours]
      properties:
        professional_id: {type: string, format: uuid}
        context: {type: string, enum: [personal, organization]}
        organization_id: {type: [string, 'null'], format: uuid}
        timezone: {type: string}
        recurring_hours: {type: object, additionalProperties: true}
        specialist_approved: {type: boolean, default: false}
        company_approved: {type: boolean, default: false}
    PublicAvailability:
      type: object
      required: [offer_id, visibility]
      properties:
        offer_id: {type: string, format: uuid}
        visibility: {type: string, enum: [hidden, busy_only, free_slots]}
        slots:
          type: array
          items:
            type: object
            required: [start_at, end_at]
            properties:
              start_at: {type: string, format: date-time}
              end_at: {type: string, format: date-time}
    NotificationSummary:
      type: object
      required: [id, kind, state, created_at]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string}
        state: {type: string, enum: [pending, sent, delivered, failed]}
        created_at: {type: string, format: date-time}
    Country:
      type: object
      required: [id, code, name]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
    City:
      type: object
      required: [id, name, country_id]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        country_id:
          type: string
          format: uuid
        area_id:
          type: [string, 'null']
          format: uuid
        timezone:
          type: [string, 'null']
    GeoSuggestion:
      type: object
      properties:
        country_id:
          type: [string, 'null']
          format: uuid
        city_id:
          type: [string, 'null']
          format: uuid
        confidence:
          type: string
          enum: [low, medium]
    MeResponse:
      type: object
      required: [user_id, person_id]
      properties:
        user_id:
          type: string
          format: uuid
        person_id:
          type: string
          format: uuid
        workspace_ids:
          type: array
          items:
            type: string
            format: uuid
    ProfessionalProfile:
      type: object
      required: [id, profession_id, lifecycle_status]
      properties:
        id:
          type: string
          format: uuid
        profession_id:
          type: string
          format: uuid
        lifecycle_status:
          type: string
          enum: [draft, published, paused, hidden, archived, pending_deletion, erased]
        slug:
          type: [string, 'null']
        version:
          type: integer
          minimum: 1
    CreateProfessionalProfile:
      type: object
      additionalProperties: false
      required: [profession_id]
      properties:
        profession_id:
          type: string
          format: uuid
        preferred_slug:
          type: string
          maxLength: 100
    CancellationPolicy:
      type: object
      required: [offer_id, free_cancel_before_minutes, revision]
      properties:
        offer_id:
          type: string
          format: uuid
        free_cancel_before_minutes:
          type: integer
          minimum: 0
          maximum: 10080
        revision:
          type: integer
          minimum: 1
    CancellationPreview:
      type: object
      required: [request_id, current_status, timezone, reliability_may_change]
      properties:
        request_id:
          type: string
          format: uuid
        current_status:
          type: string
        scheduled_start_at:
          type: [string, 'null']
          format: date-time
        free_cancel_until:
          type: [string, 'null']
          format: date-time
        policy_revision:
          type: [integer, 'null']
        warning_kind:
          type: string
          enum: [none, late_customer, provider_cancel]
        reliability_may_change:
          type: boolean
        timezone:
          type: string
    CancellationResult:
      type: object
      required: [request_id, status, cancelled_at, reliability_event_state, notification_state]
      properties:
        request_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [cancelled_by_customer, cancelled_by_provider, cancelled_mutual]
        cancelled_at:
          type: string
          format: date-time
        reliability_event_state:
          type: string
          enum: [none, proposed, effective]
        notification_state:
          type: string
          const: queued
        version:
          type: integer
          minimum: 1
    ReliabilitySummary:
      type: object
      required: [subject_kind, period_days, formula_version, sample_size, has_enough_data, negative_event_count]
      properties:
        subject_kind:
          type: string
          enum: [customer, professional, organization]
        period_days:
          type: integer
          const: 180
        formula_version:
          type: string
        score:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
        sample_size:
          type: integer
          minimum: 0
        has_enough_data:
          type: boolean
        negative_event_count:
          type: integer
          minimum: 0
        updated_at:
          type: [string, 'null']
          format: date-time
    LegacyBooking:
      type: object
      description: Legacy alias for old /bookings endpoint only; new code uses ServiceRequest.
      required: [id, state, service_offer_id]
      properties:
        id:
          type: string
          format: uuid
        state:
          type: string
          enum: [pending, accepted, declined, completed, cancelled_by_customer, cancelled_by_provider, cancelled_mutual, expired]
        service_offer_id:
          type: string
          format: uuid
    SavedItem:
      type: object
      required: [target_kind, target_id]
      properties:
        target_kind:
          type: string
          enum: [professional, organization, location, offer]
        target_id:
          type: string
          format: uuid
    CreateReview:
      type: object
      additionalProperties: false
      required: [target_kind, target_id, rating]
      properties:
        target_kind:
          type: string
          enum: [professional, organization, location]
        target_id:
          type: string
          format: uuid
        rating:
          type: integer
          minimum: 1
          maximum: 5
        text:
          type: string
          maxLength: 3000
    Review:
      allOf:
        - $ref: '#/components/schemas/CreateReview'
        - type: object
          required: [id, experience_id, status]
          properties:
            id:
              type: string
              format: uuid
            experience_id:
              type: string
              format: uuid
            status:
              type: string
              enum: [submitted, published, under_review, hidden, removed]
    ApiError:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
        details:
          type: object
          additionalProperties: true
  responses:
    Unauthorized:
      description: Not authenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Insufficient resource permission
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Duplicate or invalid concurrent transition
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Resource not public or not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
