  /guest-requests/recovery/challenges:
    post:
      tags: [Bookings]
      operationId: startGuestRequestRecovery
      summary: Восстановить доступ к гостевой заявке через оригинальный контакт
      description: >
        Generic response without contact or request enumeration. Requires
        independent rate, resend and provider-budget limits. No session/capability
        is returned at this step and no new ServiceRequest is created.
