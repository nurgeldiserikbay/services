              properties:
                code:
                  type: string
                  minLength: 4
                  maxLength: 12
      responses:
        '200':
          description: Short-lived scoped capability; never expose via URL or logs
          content:
            application/json:
              schema:
                type: object
                required: [guest_capability, expires_at]
                properties:
                  guest_capability:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
        '429':
          description: Too many attempts
  /guest-inquiries:
    post:
