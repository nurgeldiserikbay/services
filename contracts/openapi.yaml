        country_id:
          type: string
          format: uuid
        code:
          type: [string, 'null']
        name:
          type: string
    City:
      type: object
      required: [id, country_id, name]
      properties:
        id:
          type: string
          format: uuid
        country_id:
          type: string
          format: uuid
        area_id:
          type: [string, 'null']
          format: uuid
        name:
          type: string
        timezone:
          type: [string, 'null']
          description: IANA timezone name, e.g. Asia/Almaty
    GeoSuggestion:
      type: object
      required: [source, confidence]
      properties:
        country_id:
          type: [string, 'null']
          format: uuid
        area_id:
          type: [string, 'null']
          format: uuid
        city_id:
          type: [string, 'null']
          format: uuid
        source:
          type: string
          enum: [network, fallback, unavailable]
        confidence:
          type: string
          enum: [low, medium]
    MeResponse:
      type: object
      required: [user_id, person_id]
      properties:
        user_id:
          type: string
