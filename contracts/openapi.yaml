      responses:
        '202':
          description: Generic challenge initiation response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [challenge_id]
                properties:
                  challenge_id: {type: string, format: uuid}
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /guest-requests/recovery/challenges/{id}/verify:
    post:
      tags: [Bookings]
      operationId: verifyGuestRequestRecovery
      summary: Проверить OTP и открыть ограниченное окно выбора своих заявок
      description: >
        Successful verification grants a short-lived recovery session only,
        not a blanket READ_CANCEL capability. The server resolves candidate
        requests exclusively from the verified original contact. Web sessions
        use HttpOnly Secure SameSite cookie and mutations require CSRF protection;
        native sessions use OS secure storage. No tokens in URL, response logs or analytics.
      security: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: {type: string, minLength: 4, maxLength: 12}
                client_kind: {type: string, enum: [web, native], default: web}
      responses:
        '200':
          description: Verified session; web receives HttpOnly cookie, native receives short-lived recovery proof through TLS
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [recovery_session_expires_at, requests]
                properties:
                  recovery_session_expires_at: {type: string, format: date-time}
                  recovery_access_token:
                    type: string
                    description: Native-only recovery proof returned for client_kind=native; omit for web cookies; never put in URLs or logs.
                  requests:
                    type: array
                    maxItems: 100
                    description: Only opaque request identifiers belonging to verified contact; paginate beyond the limit.
                    items: {type: string, format: uuid}
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /guest-requests/recovery/requests/{id}/session:
    post:
      tags: [Bookings]
      operationId: selectRecoveredGuestRequest
      summary: Выпустить новый READ_CANCEL для одной проверенной заявки
      description: >
        Requires the contact-verified recovery session and CSRF protection on
        web. Request UUID must belong to the verified contact; revalidate
        request state and ownership, rotate session, and never elevate to MANAGE_SCHEDULE.
        Response is private no-store; guest capability never appears in URL.
      security:
        - guestRecoverySession: []
        - guestRecoveryBearer: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Single request-scoped session established
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [request_id, scope, expires_at]
                properties:
                  request_id: {type: string, format: uuid}
                  scope: {type: string, const: read_cancel}
                  expires_at: {type: string, format: date-time}
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
