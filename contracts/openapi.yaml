openapi: 3.1.0
info:
  title: Services API — MVP design contract
  version: 0.5.1
  description: >
    Частичный проектный контракт API для простых заявок, публичного каталога и персональных закладок. На момент создания не означает,
    что эти маршруты реализованы. Все серверные операции дополнительно проверяют ACL.
servers:
  - url: https://api.example.invalid/v1
    description: Placeholder; not an actual API
tags:
  - name: Identity
  - name: Geography
  - name: Professionals
  - name: Organizations
  - name: Bookings
  - name: Reviews
paths:
  /auth/challenges:
    post:
      tags: [Identity]
      operationId: createAccountAuthChallenge
      summary: Начать явный sign-in/sign-up по SMS/email OTP
      description: Always generic response; signup requires consent later, and guest verification never creates an account.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthChallengeRequest'
      responses:
        '202':
          description: Accepted; does not reveal whether contact has an account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthChallengeCreated'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/challenges/{id}/verify:
    post:
      tags: [Identity]
      operationId: verifyAccountAuthChallenge
      summary: Использовать код один раз; создать сессию только после явного intent
      security: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthChallengeVerify'
      responses:
        '200':
          description: Web sets protected cookie; native receives token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionIssued'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/refresh:
    post:
      tags: [Identity]
      operationId: refreshAccountSession
      summary: Rotate native refresh family or renew protected web session
      description: Native refresh must be single use; refresh replay revokes family.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                refresh_token: {type: string, minLength: 24}
      responses:
        '200':
          description: Rotated/renewed session with delivery mode
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionIssued'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/logout:
    post:
      tags: [Identity]
      operationId: logoutAccountSession
      summary: Отозвать текущую cookie/native сессию
      security:
        - sessionAuth: []
        - webSession: []
      responses:
        '204':
          description: Current session revoked and cookie cleared for web
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout-all:
    post:
      tags: [Identity]
      operationId: revokeAllAccountSessions
      summary: Отозвать все сессии после проверенного step-up
      security:
        - sessionAuth: []
        - webSession: []
      responses:
        '204':
          description: Session family revoked across devices
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/sessions:
    get:
      tags: [Identity]
      operationId: listMyAccountSessions
      summary: Собственные устройства/сессии без раскрытия токенов
      security:
        - sessionAuth: []
        - webSession: []
      responses:
        '200':
          description: Private active sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuthSessionSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /professions:
    get:
      tags: [Professionals]
      operationId: listProfessions
      summary: Публичная каноническая таксономия профессий
      security: []
      parameters:
        - name: q
          in: query
          schema: {type: string, maxLength: 120}
        - name: locale
          in: query
          schema: {type: string, maxLength: 12}
      responses:
        '200':
          description: Canonical professions, not duplicate professional identities
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/TaxonomyItem'}
  /service-definitions:
    get:
      tags: [Professionals]
      operationId: listServiceDefinitions
      summary: Публичные виды услуг, независимо от цены и продавца
      security: []
      parameters:
        - name: profession_id
          in: query
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: List of service definitions
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/TaxonomyItem'}
  /organizations:
    post:
      tags: [Organizations]
      operationId: createOrganization
      summary: Создать организацию в статусе draft; verification required to claim real business
      security:
        - sessionAuth: []
        - webSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganization'
      responses:
        '201':
          description: Created draft, not verified automatically
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '409':
          $ref: '#/components/responses/Conflict'
  /organizations/{id}:
    get:
      tags: [Organizations]
      operationId: getOrganizationPublic
      security: []
      description: >
        Public projection of ACTIVE organization only. DRAFT, SUSPENDED,
        CLOSED or nonexistent records return indistinguishable 404.
        Included offers must be published. Never disclose owner identity,
        nonpublic contacts, staff affiliation permissions or private schedule.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Published company profile, excludes private owner contacts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '404':
          $ref: '#/components/responses/NotFound'
  /me/professional-profiles/{id}:
    patch:
      tags: [Professionals]
      operationId: updateOwnProfessionalProfile
      summary: Owner edits own professional page, not any company version
      security:
        - sessionAuth: []
        - webSession: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: If-Match
          in: header
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                title: {type: string, maxLength: 180}
                about: {type: string, maxLength: 3000}
      responses:
        '200':
          description: Updated owner profile; version incremented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfessionalProfile'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /professional-profiles/{id}/company-views/{organization_id}/permissions:
    put:
      tags: [Professionals]
      operationId: setCompanyFieldsAllowedByProfessional
      summary: Мастер разрешает поля своей страницы конкретной компании
      security:
        - sessionAuth: []
        - webSession: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: organization_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: If-Match
          in: header
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyFieldsPermission'
      responses:
        '200':
          description: New master allowlist revision; published caches invalidated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyFieldsPermission'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /organizations/{id}/professionals/{profile_id}/view:
    put:
      tags: [Organizations]
      operationId: setCompanyProfessionalView
      summary: Компания выбирает подмножество разрешённых мастером полей и корпоративное оформление
      security:
        - sessionAuth: []
        - webSession: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: profile_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: If-Match
          in: header
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyProfessionalViewUpdate'
      responses:
        '200':
          description: Published view contains only intersection of permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyProfessionalView'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /service-offers:
    post:
      tags: [Professionals]
      operationId: createServiceOffer
      summary: Продавец создаёт услугу с простым приёмом заявок и необязательной ценой
      security:
        - sessionAuth: []
        - webSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServiceOffer'
      responses:
        '201':
          description: Created offer draft; seller chosen once, server validates ownership
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOffer'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /service-offers/{id}:
    get:
      tags: [Professionals]
      operationId: getPublishedServiceOffer
      summary: Публичная услуга с реальным продавцом и доступными каналами
      security: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Published public offer only, excludes hidden private contacts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOffer'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Professionals]
      operationId: updateServiceOffer
      summary: Seller updates draft or future terms without changing seller of existing requests
      security:
        - sessionAuth: []
        - webSession: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: If-Match
          in: header
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                title: {type: string, maxLength: 200}
                contact_methods:
                  type: array
                  uniqueItems: true
                  minItems: 1
                  items: {type: string, enum: [phone, whatsapp, guest_request, book_slot]}
                availability_visibility: {type: string, enum: [hidden, busy_only, free_slots]}
                price_label: {type: [string, 'null'], maxLength: 160}
      responses:
        '200':
          description: Updated offer revision; existing request terms unaffected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOffer'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /requests:
    post:
      tags: [Bookings]
      operationId: createServiceRequest
      summary: Простая заявка авторизованного клиента; гость использует verified guest route
      security:
        - sessionAuth: []
        - webSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServiceRequest'
      responses:
        '201':
          description: Pending request received by the server-resolved seller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /requests/{id}:
    get:
      tags: [Bookings]
      operationId: getOwnServiceRequest
      summary: Клиент/продавец видит только свою заявку; гость — по проверенному доступу
      security:
        - sessionAuth: []
        - webSession: []
        - guestCapability: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: Guest-Capability
          in: header
          required: false
          schema: {type: string}
      responses:
        '200':
          description: Scoped private request detail, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /requests/{id}/complete:
    post:
      tags: [Bookings]
      operationId: completeServiceRequest
      summary: Продавец отмечает выполнение; это ещё не verified review
      security:
        - sessionAuth: []
        - webSession: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Request marked complete, customer can confirm experience separately
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '403':
          $ref: '#/components/responses/Forbidden'
  /requests/{id}/schedule:
    patch:
      tags: [Bookings]
      operationId: changeServiceRequestSchedule
      deprecated: true
      summary: Legacy draft — продавец отмечает время; без подтверждения другой стороны штрафы запрещены
      description: >
        Deprecated design route. A seller-entered time is NOT a verified agreement and MUST NOT
        activate automatic late customer penalties. Proposed replacement is ADR-0006
        schedule-proposals with explicit recipient confirmation. Do not implement this
        route as unilateral confirmed-schedule mutation.
      security:
        - sessionAuth: []
        - webSession: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: If-Match
          in: header
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleUpdate'
      responses:
        '200':
          description: Legacy seller-entered schedule note only; no new penalizing deadline until customer confirmation (see ADR-0006)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '403':
          $ref: '#/components/responses/Forbidden'
  /guest-requests/{id}/schedule-access/challenges:
    post:
      tags: [Bookings]
      operationId: startGuestScheduleVerification
      summary: Подтверждение исходного гостевого контакта для управления временем
      description: Reverify the original contact tied to this request; READ_CANCEL only begins verification and does not permit schedule changes.
      security:
        - guestCapability: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/GuestCapabilityHeader'
      responses:
        '202':
          description: Generic anti-enumeration response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestScheduleChallenge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /guest-requests/{id}/schedule-access/challenges/{challengeId}/verify:
    post:
      tags: [Bookings]
      operationId: verifyGuestScheduleChallenge
      summary: Выдать ограниченное право управления временем после OTP
      security:
        - guestCapability: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: challengeId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/GuestCapabilityHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: {type: string, minLength: 4, maxLength: 12}
      responses:
        '200':
          description: Request-bound MANAGE_SCHEDULE capability; no account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestScheduleGrant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /requests/{id}/schedule-proposals:
    post:
      tags: [Bookings]
      operationId: proposeRequestSchedule
      summary: Предложить время услуги; статус заявки остаётся ACCEPTED
      description: >
        ADR-0006 PROPOSED. Caller is customer or seller; guest caller needs MANAGE_SCHEDULE capability. Proposal is NOT
        an agreement, cannot create a cancellation penalty or guaranteed busy slot.
      security:
        - sessionAuth: []
        - webSession: []
        - guestCapability: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestVersion'
        - $ref: '#/components/parameters/GuestCapabilityHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleProposalCreate'
      responses:
        '201':
          description: Proposed, recipient notified asynchronously
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleProposal'
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /requests/{id}/schedule-proposals/{proposalId}/confirm:
    post:
      tags: [Bookings]
      operationId: confirmRequestScheduleProposal
      summary: Вторая сторона подтверждает предложенное время
      description: >
        Only a non-initiating authorized actor may confirm a current proposal. Guest callers require MANAGE_SCHEDULE (not READ_CANCEL).
        Check slot conflicts, CAS and cancellation snapshot in one transaction.
      security:
        - sessionAuth: []
        - webSession: []
        - guestCapability: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/ScheduleProposalId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestVersion'
        - $ref: '#/components/parameters/GuestCapabilityHeader'
      responses:
        '200':
          description: Confirmed, current cancellation policy available to authorized users
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ScheduleProposal'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /requests/{id}/schedule-proposals/{proposalId}/decline:
    post:
      tags: [Bookings]
      operationId: declineRequestScheduleProposal
      summary: Отклонить предложенное время без отмены самой заявки
      description: Guest request participant requires request-scoped MANAGE_SCHEDULE capability; READ_CANCEL is insufficient.
      security:
        - sessionAuth: []
        - webSession: []
        - guestCapability: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/ScheduleProposalId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestVersion'
        - $ref: '#/components/parameters/GuestCapabilityHeader'
      responses:
        '200':
          description: Proposal declined, request remains ACCEPTED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ScheduleProposal'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /me/requests:
    get:
      tags: [Bookings]
      operationId: getMyCustomerRequests
      summary: Приватная история заявок авторизованного клиента
      security:
        - sessionAuth: []
        - webSession: []
      responses:
        '200':
          description: Customer-owned requests, cursor pagination to implement
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ServiceRequest'}
  /me/availability-allocations:
    get:
      tags: [Bookings]
      operationId: listMyWorkAllocations
      summary: Мои личные и согласованные корпоративные часы
      security:
        - sessionAuth: []
        - webSession: []
      responses:
        '200':
          description: Only owned professional allocations, excluding details of other contexts
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/WorkAllocation'}
    put:
      tags: [Bookings]
      operationId: setMyWorkAllocation
      summary: Мастер предлагает персональное или корпоративное время
      security:
        - sessionAuth: []
        - webSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkAllocation'
      responses:
        '200':
          description: Personal allocation active; company allocation requires company approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkAllocation'
        '403':
          $ref: '#/components/responses/Forbidden'
  /public-availability:
    get:
      tags: [Bookings]
      operationId: getPublicOfferAvailability
      summary: Only published free slots or busy indicator when seller opted in
      security: []
      parameters:
        - name: offer_id
          in: query
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Does not reveal where/with whom a professional is busy elsewhere
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicAvailability'
  /me/notifications:
    get:
      tags: [Identity]
      operationId: listMyNotifications
      summary: Частные уведомления, отдельные от статуса фактической доставки
      security:
        - sessionAuth: []
        - webSession: []
      responses:
        '200':
          description: Private notifications
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/NotificationSummary'}
  /me/saved-items/{id}:
    delete:
      tags: [Identity]
      operationId: removeSavedItem
      summary: Удалить свою закладку, не влияя на чужие профили
      security:
        - sessionAuth: []
        - webSession: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: Removed
        '403':
          $ref: '#/components/responses/Forbidden'
  /me:
    get:
      tags: [Identity]
      operationId: getMe
      summary: Получить свою учётную запись
      security:
        - sessionAuth: []
        - webSession: []
      responses:
        '200':
          description: User workspace summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/professional-profiles:
    get:
      tags: [Professionals]
      operationId: listMyProfessionalProfiles
      security:
        - sessionAuth: []
        - webSession: []
      responses:
        '200':
          description: Own professional identities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProfessionalProfile'
    post:
      tags: [Professionals]
      operationId: createProfessionalProfile
      summary: Одна страница на одну каноническую профессию
      security:
        - sessionAuth: []
        - webSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProfessionalProfile'
      responses:
        '201':
          description: Created profile
          content:
            application/json:
