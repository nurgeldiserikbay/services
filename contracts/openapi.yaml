            schema:
              type: object
              required: [service_offer_id, consent_to_contact]
              additionalProperties: false
              properties:
                service_offer_id:
                  type: string
                  format: uuid
                note:
                  type: string
                  maxLength: 1000
                consent_to_contact:
                  type: boolean
                  const: true
      responses:
        '201':
          description: Guest inquiry submitted without User account
          content:
            application/json:
              schema:
                type: object
                required: [id, state]
                properties:
                  id:
                    type: string
                    format: uuid
                  state:
                    const: requested
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

