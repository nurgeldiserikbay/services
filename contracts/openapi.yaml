      security: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              additionalProperties: false
              properties:
                code:
                  type: string
                  minLength: 4
                  maxLength: 12
      responses:
        '200':
          description: Short-lived scoped capability; never expose via URL or logs
          content:
            application/json:
              schema:
                type: object
                required: [guest_capability, expires_at]
                properties:
                  guest_capability:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
        '429':
          description: Too many attempts
  /guest-requests:
    post:
      tags: [Bookings]
      operationId: createGuestRequest
      security:
        - guestCapability: []
      summary: Простая заявка без постоянного аккаунта
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: Guest-Capability
          in: header
          required: true
          schema:
            type: string
          description: Scoped, short-lived proof from guest contact verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [service_offer_id, consent_to_contact]
              additionalProperties: false
              properties:
                service_offer_id:
                  type: string
                  format: uuid
                note:
                  type: string
                  maxLength: 1000
                consent_to_contact:
                  type: boolean
                  const: true
      responses:
        '201':
          description: Guest inquiry submitted without User account
          content:
            application/json:
              schema:
                type: object
                required: [id, state, request_capability, expires_at]
                properties:
                  request_capability:
                    type: string
                    description: New request-scoped capability, separate from one-time create proof.
                  expires_at:
                    type: string
                    format: date-time
                  id:
                    type: string
                    format: uuid
                  state:
                    const: pending
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

components:
  securitySchemes:
    guestRecoveryBearer:
      type: http
      scheme: bearer
      bearerFormat: RecoveryProof
      description: Native-only short-lived contact-verified recovery proof; never a registered account session.
    adminSession:
      type: apiKey
      in: cookie
      name: __Host-services_admin_session
      description: Dedicated administrator session, MFA and scope checked server-side.
    guestRecoverySession:
      type: apiKey
      in: cookie
      name: __Host-services_guest_recovery
      description: Verified-contact recovery session, not a registered login or blanket request capability. For native clients an equivalent short-lived proof uses a dedicated securely stored bearer flow.
    webSession:
      type: apiKey
      in: cookie
      name: __Host-services_session
      description: HttpOnly Secure same-site session; cookie mutations require Origin and CSRF validation.
    guestCapability:
      type: apiKey
      in: header
      name: Guest-Capability
      description: Opaque, short-lived hash-stored capability scoped to one guest request.
    sessionAuth:
      type: http
      scheme: bearer
      bearerFormat: AccessToken
      description: Native/mobile short-lived bearer; browser uses webSession cookie through BFF.
  parameters:
    ResourceId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    NoShowClaimId:
      in: path
      name: claimId
      required: true
      schema: {type: string, format: uuid}
    ScheduleProposalId:
      in: path
      name: proposalId
      required: true
      schema: {type: string, format: uuid}
    RequestVersion:
      in: header
      name: If-Match
      required: true
      description: Current ServiceRequest version, quoted decimal integer
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
    GuestCapabilityHeader:
      in: header
      name: Guest-Capability
      required: false
      description: For schedule endpoints only MANAGE_SCHEDULE bound to the request; READ_CANCEL is insufficient
      schema: {type: string, minLength: 24}
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      description: >
        Stable per logical mutation and principal. Reusing key with a different body returns 409.
      schema:
        type: string
        minLength: 8
        maxLength: 128
  schemas:
    NoShowClaim:
      type: object
      additionalProperties: false
      required: [id, request_id, schedule_revision, status, seller_reported_at]
      properties:
        id: {type: string, format: uuid}
        request_id: {type: string, format: uuid}
        schedule_revision: {type: integer, minimum: 1}
        status:
          type: string
          enum: [filed, awaiting_customer, disputed, uncontested, under_review, confirmed, rejected, expired]
        seller_reported_at: {type: string, format: date-time}
        customer_responded_at: {type: [string, 'null'], format: date-time}
        reviewed_at: {type: [string, 'null'], format: date-time}
    AuthChallengeRequest:
      type: object
      additionalProperties: false
      required: [channel, contact, purpose, locale]
      properties:
        channel: {type: string, enum: [email, sms]}
        contact: {type: string, maxLength: 320}
        purpose: {type: string, enum: [sign_in, sign_up]}
        locale: {type: string, enum: [kk, ru, en]}
    AuthChallengeCreated:
      type: object
      additionalProperties: false
      required: [challenge_id, retry_after_seconds]
      properties:
        challenge_id: {type: string, format: uuid}
        retry_after_seconds: {type: integer, minimum: 0}
    AuthChallengeVerify:
      type: object
      additionalProperties: false
      required: [code, delivery]
      properties:
        code: {type: string, minLength: 4, maxLength: 12}
        delivery: {type: string, enum: [web_cookie, native_tokens]}
        accept_terms_version: {type: [string, 'null'], maxLength: 40}
        accept_privacy_version: {type: [string, 'null'], maxLength: 40}
      description: Signup requires explicit terms/privacy version acknowledgment; guest capabilities never act as signup.
    AuthSessionIssued:
      type: object
      additionalProperties: false
      required: [person_id, delivery]
      properties:
        person_id: {type: string, format: uuid}
        delivery: {type: string, enum: [web_cookie, native_tokens]}
        access_token: {type: [string, 'null'], description: Native only; not returned in web cookie mode.}
        refresh_token: {type: [string, 'null'], description: Native only; never stored in localStorage.}
        expires_at: {type: [string, 'null'], format: date-time}
    AuthSessionSummary:
      type: object
      additionalProperties: false
      required: [id, created_at]
      properties:
        id: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
        last_used_at: {type: [string, 'null'], format: date-time}
        device_label: {type: [string, 'null'], maxLength: 120}
        is_current: {type: boolean}
    TaxonomyItem:
      type: object
      required: [id, code, name]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        name: {type: string}
    CreateOrganization:
      type: object
      additionalProperties: false
      required: [name, slug]
      properties:
        name: {type: string, minLength: 2, maxLength: 200}
        slug: {type: string, minLength: 3, maxLength: 160}
    Organization:
      type: object
      description: >
        Public ACTIVE company read model and published offer summaries only.
        No owner person, membership, private contact or moderation data.
      required: [id, slug, name, status, offers]
      properties:
        id: {type: string, format: uuid}
        slug: {type: string}
        name: {type: string}
        status: {type: string, enum: [draft, active, suspended, closed]}
        offers:
          type: array
          items:
            $ref: '#/components/schemas/PublicOffer'
    CompanyFieldsPermission:
      type: object
      additionalProperties: false
      required: [allowed_fields]
      properties:
        allowed_fields:
          type: array
          uniqueItems: true
          items: {type: string}
          description: Versioned field allowlist; server validates registered field keys
    CompanyProfessionalViewUpdate:
      type: object
      additionalProperties: false
      required: [selected_fields]
      properties:
        selected_fields:
          type: array
          uniqueItems: true
          items: {type: string}
        corporate_role: {type: [string, 'null'], maxLength: 160}
    CompanyProfessionalView:
      type: object
      required: [organization_id, professional_id, visible_fields, revision]
      properties:
        organization_id: {type: string, format: uuid}
        professional_id: {type: string, format: uuid}
        visible_fields:
          type: array
          items: {type: string}
        revision: {type: integer, minimum: 1}
    CreateServiceOffer:
      type: object
      additionalProperties: false
      required: [definition_id, title, seller_kind, seller_id, contact_methods]
      properties:
        definition_id: {type: string, format: uuid}
        title: {type: string, maxLength: 200}
        seller_kind: {type: string, enum: [professional, organization]}
        seller_id: {type: string, format: uuid}
        contact_methods:
          type: array
          uniqueItems: true
          minItems: 1
          items: {type: string, enum: [phone, whatsapp, guest_request, book_slot]}
        delivery_mode: {type: string, enum: [at_location, at_customer, online, hybrid]}
        city_id: {type: [string, 'null'], format: uuid}
        price_label: {type: [string, 'null'], maxLength: 160}
        availability_visibility: {type: string, enum: [hidden, busy_only, free_slots]}
    ServiceOffer:
      type: object
      additionalProperties: false
      description: Public projection of a PUBLISHED offer with eligible public seller. Never return raw contacts JSON, secret contact links, private calendars, or owner identity.
      required: [id, definition_id, title, seller_kind, seller_id, status, contact_methods, city_id, price_label, availability_visibility]
      properties:
        id: {type: string, format: uuid}
        definition_id: {type: string, format: uuid}
        title: {type: string}
        seller_kind: {type: string, enum: [professional, organization]}
        seller_id: {type: string, format: uuid}
        status: {type: string, enum: [draft, published, paused, archived]}
        contact_methods:
          type: array
          uniqueItems: true
          description: Only published channel names, never phone numbers, WhatsApp IDs, secrets or bearer links.
          items: {type: string, enum: [phone, whatsapp, guest_request, book_slot]}
        city_id: {type: [string, 'null'], format: uuid}
        price_label: {type: [string, 'null']}
        availability_visibility: {type: string, enum: [hidden, busy_only, free_slots]}
    CreateServiceRequest:
      type: object
      required: [service_offer_id, source_context]
      additionalProperties: false
      properties:
        service_offer_id: {type: string, format: uuid}
        source_context: {type: string, enum: [personal, organization]}
        desired_start_at: {type: [string, 'null'], format: date-time}
        desired_end_at: {type: [string, 'null'], format: date-time}
        note: {type: [string, 'null'], maxLength: 1000}
      description: Seller is resolved from offer by backend, never taken from caller.
    ServiceRequest:
      type: object
      required: [id, service_offer_id, seller_kind, seller_id, source_context, state, version]
      properties:
        id: {type: string, format: uuid}
        service_offer_id: {type: string, format: uuid}
        seller_kind: {type: string, enum: [professional, organization]}
        seller_id: {type: string, format: uuid}
        source_context: {type: string, enum: [personal, organization]}
        state:
          type: string
          enum: [pending, accepted, declined, cancelled_by_customer, cancelled_by_provider, cancelled_mutual, completed, expired]
        scheduled_start_at: {type: [string, 'null'], format: date-time}
        scheduled_end_at: {type: [string, 'null'], format: date-time}
        performer_professional_id: {type: [string, 'null'], format: uuid}
        schedule_reconciliation_required: {type: boolean, default: false}
        version: {type: integer, minimum: 1}
    GuestScheduleChallenge:
      type: object
      additionalProperties: false
      required: [challenge_id]
      properties:
        challenge_id: {type: string, format: uuid}
    GuestScheduleGrant:
      type: object
      additionalProperties: false
      required: [capability, scope, expires_at]
      properties:
        capability: {type: string, minLength: 24}
        scope: {type: string, const: manage_schedule}
        expires_at: {type: string, format: date-time}
    ScheduleProposalCreate:
      type: object
      additionalProperties: false
      required: [start_at, end_at, timezone, local_start_at, utc_offset_seconds]
      description: The server validates local wall-clock and offset against IANA timezone and TZDB, rejects DST gaps and ambiguous folds without explicit offset.
      properties:
        start_at: {type: string, format: date-time}
        end_at: {type: string, format: date-time}
        timezone: {type: string, minLength: 1, maxLength: 64}
        local_start_at: {type: string, description: ISO local wall-clock datetime without an offset}
        utc_offset_seconds: {type: integer, minimum: -50400, maximum: 50400}
    ScheduleProposal:
      type: object
      additionalProperties: false
      required: [id, request_id, revision, status, initiator, start_at, end_at, timezone, request_version]
      properties:
        id: {type: string, format: uuid}
        request_id: {type: string, format: uuid}
        revision: {type: integer, minimum: 1}
        status: {type: string, enum: [proposed, confirmed, declined, superseded, closed]}
        initiator: {type: string, enum: [customer, seller]}
        start_at: {type: string, format: date-time}
        end_at: {type: string, format: date-time}
        timezone: {type: string}
        local_start_at: {type: [string, 'null'], description: Original local wall-clock value without offset}
        utc_offset_seconds: {type: [integer, 'null'], minimum: -50400, maximum: 50400}
        tzdb_version: {type: [string, 'null']}
        request_version: {type: integer, minimum: 1}
        confirmed_at: {type: [string, 'null'], format: date-time}
        cancellation_deadline_at: {type: [string, 'null'], format: date-time}
    ScheduleUpdate:
      type: object
      required: [start_at, end_at, timezone]
      additionalProperties: false
      properties:
        start_at: {type: string, format: date-time}
        end_at: {type: string, format: date-time}
        timezone: {type: string, minLength: 1, maxLength: 64}
    WorkAllocation:
      type: object
      required: [professional_id, context, timezone, recurring_hours]
      properties:
        professional_id: {type: string, format: uuid}
        context: {type: string, enum: [personal, organization]}
        organization_id: {type: [string, 'null'], format: uuid}
        timezone: {type: string}
        recurring_hours: {type: object, additionalProperties: true}
        specialist_approved: {type: boolean, default: false}
        company_approved: {type: boolean, default: false}
    PublicAvailability:
      type: object
      required: [offer_id, visibility]
      properties:
        offer_id: {type: string, format: uuid}
        visibility: {type: string, enum: [hidden, busy_only, free_slots]}
        slots:
          type: array
          items:
            type: object
            required: [start_at, end_at]
            properties:
              start_at: {type: string, format: date-time}
              end_at: {type: string, format: date-time}
    NotificationSummary:
      type: object
      required: [id, kind, state, created_at]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string}
        state: {type: string, enum: [pending, sent, delivered, failed]}
        created_at: {type: string, format: date-time}
    Country:
      type: object
      required: [id, code, name]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
    City:
      type: object
      required: [id, name, country_id]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        country_id:
          type: string
          format: uuid
        area_id:
          type: [string, 'null']
          format: uuid
        timezone:
          type: [string, 'null']
    GeoSuggestion:
      type: object
      properties:
        country_id:
          type: [string, 'null']
          format: uuid
        city_id:
          type: [string, 'null']
          format: uuid
        confidence:
          type: string
          enum: [low, medium]
    MeResponse:
      type: object
      required: [user_id, person_id]
      properties:
        user_id:
          type: string
          format: uuid
        person_id:
          type: string
          format: uuid
        workspace_ids:
          type: array
          items:
            type: string
            format: uuid
    PublicOffer:
      type: object
      additionalProperties: false
      required: [id, title, delivery_mode, price_label]
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        delivery_mode: {type: string, enum: [at_location, at_customer, online, hybrid]}
        price_label: {type: [string, 'null']}
    ProfessionalProfile:
      type: object
      description: >
        Published-only read model with public offers. This response does not
        include private person contacts, company permissions, admin notes
        or private availability; lifecycle_status is published on public GET.
      required: [id, profession_id, lifecycle_status, slug, title, offers]
      properties:
        id:
          type: string
          format: uuid
        profession_id:
          type: string
          format: uuid
        lifecycle_status:
          type: string
          enum: [draft, published, paused, hidden, archived, pending_deletion, erased]
        slug:
          type: string
        title: {type: [string, 'null']}
        offers:
          type: array
          items:
            $ref: '#/components/schemas/PublicOffer'
        version:
          type: integer
          minimum: 1
    CreateProfessionalProfile:
      type: object
      additionalProperties: false
      required: [profession_id]
      properties:
        profession_id:
          type: string
          format: uuid
        preferred_slug:
          type: string
          maxLength: 100
    CancellationPolicy:
      type: object
      required: [offer_id, free_cancel_before_minutes, revision]
      properties:
        offer_id:
          type: string
          format: uuid
        free_cancel_before_minutes:
          type: integer
          minimum: 0
          maximum: 10080
        revision:
          type: integer
          minimum: 1
    CancellationPreview:
      type: object
      required: [request_id, current_status, timezone, reliability_may_change]
      properties:
        request_id:
          type: string
          format: uuid
        current_status:
          type: string
        scheduled_start_at:
          type: [string, 'null']
          format: date-time
        free_cancel_until:
          type: [string, 'null']
          format: date-time
        policy_revision:
          type: [integer, 'null']
        warning_kind:
          type: string
          enum: [none, late_customer, provider_cancel]
        reliability_may_change:
          type: boolean
        timezone:
          type: string
    CancellationResult:
      type: object
      required: [request_id, status, cancelled_at, reliability_event_state, notification_state]
      properties:
        request_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [cancelled_by_customer, cancelled_by_provider, cancelled_mutual]
        cancelled_at:
          type: string
          format: date-time
        reliability_event_state:
          type: string
          enum: [none, proposed, effective]
        notification_state:
          type: string
          const: queued
        version:
          type: integer
          minimum: 1
    ReliabilitySummary:
      type: object
      required: [subject_kind, period_days, formula_version, sample_size, has_enough_data, negative_event_count]
      properties:
        subject_kind:
          type: string
          enum: [customer, professional, organization]
        period_days:
          type: integer
          const: 180
        formula_version:
          type: string
        score:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
        sample_size:
          type: integer
          minimum: 0
        has_enough_data:
          type: boolean
        negative_event_count:
          type: integer
          minimum: 0
        updated_at:
          type: [string, 'null']
          format: date-time
    SavedItem:
      type: object
      required: [target_kind, target_id]
      properties:
        target_kind:
          type: string
          enum: [professional, organization, location, offer]
        target_id:
          type: string
          format: uuid
    CreateReview:
      type: object
      additionalProperties: false
      required: [target_kind, target_id, rating]
      properties:
        target_kind:
          type: string
          enum: [professional, organization, location]
        target_id:
          type: string
          format: uuid
        rating:
          type: integer
          minimum: 1
          maximum: 5
        text:
          type: string
          maxLength: 3000
    Review:
      allOf:
        - $ref: '#/components/schemas/CreateReview'
        - type: object
          required: [id, experience_id, status]
          properties:
            id:
              type: string
              format: uuid
            experience_id:
              type: string
              format: uuid
            status:
              type: string
              enum: [submitted, published, under_review, hidden, removed]
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message, request_id]
      properties:
        code:
          type: string
          description: Stable machine-readable error, not localized UI text.
          examples: [REQUEST_STATE_CONFLICT, SLOT_CONFLICT, IDEMPOTENCY_PAYLOAD_MISMATCH, GUEST_CAPABILITY_EXPIRED, RESCHEDULE_REQUIRES_CONFIRMATION]
        current_version:
          type: [integer, 'null']
          minimum: 1
          description: Only supplied when requester is authorized to read the resource.
        message:
          type: string
        request_id:
          type: string
        details:
          type: object
          additionalProperties: true
  responses:
    Gone:
      description: Expired or already consumed challenge/capability
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    TooManyRequests:
      description: Rate limit exceeded; Retry-After controls safe retry
      headers:
        Retry-After:
          description: Retry delay in seconds
          schema: {type: integer, minimum: 1}
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Not authenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Insufficient resource permission
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Concurrent transition, occupied slot, or mismatched idempotency payload. Never leak a private request's version to an unauthorized caller.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Resource not public or not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
